name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "saiife") | .version')"
          if [ -z "$cargo_version" ] || [ "$cargo_version" = "null" ]; then
            echo "::error::could not read the saiife version from cargo metadata"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "release version: $cargo_version"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            file_arch: x86-64
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            file_arch: ARM aarch64
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            lipo_arch: x86_64
            # macos-latest is Apple silicon; do not depend on Rosetta.
            run: false
          - target: aarch64-apple-darwin
            os: macos-latest
            lipo_arch: arm64
            run: true
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml selects the toolchain; make sure it has the target.
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET" -p saiife
      - name: verify architecture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          set -euo pipefail
          desc="$(file -b "target/$TARGET/release/saiife")"
          echo "$desc"
          case "$desc" in
            *"$FILE_ARCH"*) ;;
            *) echo "::error::expected architecture '$FILE_ARCH'"; exit 1 ;;
          esac
          # Rust's musl targets emit static PIE, which newer file(1) reports as
          # "static-pie linked" rather than "statically linked".
          case "$desc" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::binary is not statically linked"; exit 1 ;;
          esac
      - name: verify architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          LIPO_ARCH: ${{ matrix.lipo_arch }}
        run: |
          set -euo pipefail
          archs="$(lipo -archs "target/$TARGET/release/saiife")"
          echo "$archs"
          if [ "$archs" != "$LIPO_ARCH" ]; then
            echo "::error::expected exactly '$LIPO_ARCH', got '$archs'"
            exit 1
          fi
      - name: saiife --version
        if: matrix.run
        shell: bash
        run: |
          set -euo pipefail
          out="$("target/$TARGET/release/saiife" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::--version does not report $VERSION"; exit 1 ;;
          esac
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="saiife-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/saiife" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/saiife-${{ needs.check-version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [check-version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          count="$(ls -1 saiife-*.tar.gz | wc -l)"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 tarballs, found $count"
            exit 1
          fi
          sha256sum saiife-*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: release notes
        shell: bash
        run: |
          set -euo pipefail
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if ($2 == v) found = 1 }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "saiife $GITHUB_REF_NAME" > notes.md
          fi
          cat notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "saiife $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS install.sh

  install-test:
    needs: [check-version, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: install from the release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/HrRobinson/saiife/releases/download/$GITHUB_REF_NAME/install.sh"
          # The release can take a moment to become visible.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o install.sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::install.sh not downloadable after 5 attempts"
              exit 1
            fi
            sleep 10
          done
          SAIIFE_VERSION="$VERSION" sh install.sh
      - name: saiife --version
        shell: bash
        run: |
          set -euo pipefail
          out="$("$HOME/.local/bin/saiife" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::installed saiife does not report $VERSION"; exit 1 ;;
          esac
