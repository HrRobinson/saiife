name: release

on:
  push:
    tags: ['v*']
  # Dry-run the build and linux-packages jobs on PRs that touch the release path. publish,
  # install-test and release only run for a pushed v* tag.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/release/**'
      - 'packaging/**'
      - 'scripts/package-linux/**'
      - 'scripts/package-windows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - id: version
        name: tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "saiife") | .version')"
          if [ -z "$cargo_version" ] || [ "$cargo_version" = "null" ]; then
            echo "::error::could not read the saiife version from cargo metadata"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "release version: $cargo_version"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            file_arch: x86-64
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            file_arch: ARM aarch64
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            lipo_arch: x86_64
            # macos-latest is Apple silicon; do not depend on Rosetta.
            run: false
          - target: aarch64-apple-darwin
            os: macos-latest
            lipo_arch: arm64
            run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pe_machine: '0x8664'
            run: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pe_machine: '0xAA64'
            # Cross-compiled on an x64 runner: it cannot run here.
            run: false
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check-version.outputs.version }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml selects the toolchain; make sure it has the target.
      - name: rustup target add
        shell: bash
        run: rustup target add "$TARGET"
      - name: install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # ring compiles C for ARM64 Windows with LLVM's clang. Pinned release
      # (older than 14 days) and a committed SHA-256 (GitHub's published
      # digest of the asset); the build fails if the download does not match.
      - name: clang on PATH (Windows ARM64 cross-build)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        env:
          LLVM_VERSION: 23.1.2
          LLVM_SHA256: 8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095
        run: |
          set -euo pipefail
          asset="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${asset}"
          echo "${LLVM_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p19a-llvm"
          # System32 bsdtar takes drive paths; Git Bash's GNU tar would read "D:" as
          # a remote host. The .xz, because bsdtar cannot decode this release's .zst:
          # "Frame requires too much memory for decoding".
          /c/Windows/System32/tar.exe -xf "$(cygpath -w "$RUNNER_TEMP/$asset")" \
            -C "$(cygpath -w "$RUNNER_TEMP/p19a-llvm")" --strip-components=1
          # 901 MB, on the drive the build uses too.
          rm -f "$RUNNER_TEMP/$asset"
          df -h "$RUNNER_TEMP"
          bindir="$(cygpath -w "$RUNNER_TEMP/p19a-llvm/bin")"
          echo "$bindir" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/p19a-llvm/bin/clang" --version
      - name: cargo build
        shell: bash
        run: cargo build --release --locked --target "$TARGET" -p saiife
      - name: verify architecture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          set -euo pipefail
          desc="$(file -b "target/$TARGET/release/saiife")"
          echo "$desc"
          case "$desc" in
            *"$FILE_ARCH"*) ;;
            *) echo "::error::expected architecture '$FILE_ARCH'"; exit 1 ;;
          esac
          # Rust's musl targets emit static PIE, which newer file(1) reports as
          # "static-pie linked" rather than "statically linked".
          case "$desc" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::binary is not statically linked"; exit 1 ;;
          esac
      - name: verify architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          LIPO_ARCH: ${{ matrix.lipo_arch }}
        run: |
          set -euo pipefail
          archs="$(lipo -archs "target/$TARGET/release/saiife")"
          echo "$archs"
          if [ "$archs" != "$LIPO_ARCH" ]; then
            echo "::error::expected exactly '$LIPO_ARCH', got '$archs'"
            exit 1
          fi
      - name: verify architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PE_MACHINE: ${{ matrix.pe_machine }}
        run: |
          $exe = Join-Path $PWD "target/$env:TARGET/release/saiife.exe"
          $b = [System.IO.File]::ReadAllBytes($exe)
          # e_lfanew at 0x3C, then "PE\0\0", then the Machine field.
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $got = '0x{0:X4}' -f $machine
          Write-Output "PE Machine: $got"
          if ([Convert]::ToUInt16($env:PE_MACHINE, 16) -ne $machine) {
            Write-Output "::error::expected PE Machine $env:PE_MACHINE, got $got"
            exit 1
          }
      # Hardened runtime always; Developer ID + notarization only when all six
      # secrets exist (none: ad-hoc with a warning; some: fail). The secrets
      # reach this step only, never the job. Fork PRs have none, so they stay
      # green in ad-hoc mode.
      - name: sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Secrets exist only on v* tag pushes: PRs and branch runs (same-repo
        # included) get empty strings, see "none" and take the ad-hoc path.
        # All six use the same gate, so it can never yield a partial set.
        env:
          MACOS_SIGN_P12_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_P12_BASE64 || '' }}
          MACOS_SIGN_P12_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_P12_PASSWORD || '' }}
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_NOTARY_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_NOTARY_APPLE_ID || '' }}
          APPLE_NOTARY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_NOTARY_PASSWORD || '' }}
        run: bash scripts/release/macos-sign.sh "target/$TARGET/release/saiife" "$TARGET"
      # Authenticode via Azure Artifact Signing, only when all six secrets
      # exist (none: unsigned with a warning; some: fail). Same gate as macOS:
      # the secrets exist only on v* tag refs, so PRs, forks and a
      # workflow_dispatch on a branch get empty strings and stay green. They
      # reach this step and the signing action's inputs, never the job env.
      # Secret-based auth, so no id-token permission is needed.
      - name: signing mode (Windows)
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_SIGN_AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_TENANT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_SECRET || '' }}
          WINDOWS_SIGN_ENDPOINT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ENDPOINT || '' }}
          WINDOWS_SIGN_ACCOUNT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ACCOUNT || '' }}
          WINDOWS_SIGN_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PROFILE || '' }}
        run: bash scripts/release/windows-sign-mode.sh "$TARGET"
      - name: sign (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'artifact-signing'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_ID || '' }}
          azure-client-secret: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_SECRET || '' }}
          endpoint: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ENDPOINT || '' }}
          signing-account-name: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ACCOUNT || '' }}
          certificate-profile-name: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PROFILE || '' }}
          cache-dependencies: 'false'
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\saiife.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: signtool verify (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'artifact-signing'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if ($null -eq $signtool) { Write-Output '::error::signtool.exe not found'; exit 1 }
          & $signtool.FullName verify /pa /v "target/$env:TARGET/release/saiife.exe"
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::signtool verify failed'; exit 1 }
      - name: saiife --version
        if: matrix.run
        shell: bash
        run: |
          set -euo pipefail
          out="$("target/$TARGET/release/saiife$EXE" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::--version does not report $VERSION"; exit 1 ;;
          esac
      - name: package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="saiife-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/saiife" LICENSE README.md "dist/$name/"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      # A flat zip: saiife.exe, LICENSE, README.md (install.ps1 reads saiife.exe).
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "saiife-$env:VERSION-$env:TARGET"
          $stage = Join-Path $PWD "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/saiife.exe", 'LICENSE', 'README.md' -Destination $stage
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $PWD "dist/$name.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $a = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $a.Entries | ForEach-Object { $_.FullName } } finally { $a.Dispose() }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/saiife-${{ needs.check-version.outputs.version }}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            dist/SIGNING-*.txt
          if-no-files-found: error

  linux-packages:
    needs: [check-version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: extract the release binary
        shell: bash
        run: |
          set -euo pipefail
          name="saiife-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/p18-bin"
          # The packaged bytes are the tarball's bytes.
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP/p18-bin" "$name/saiife"
          echo "SAIIFE_BIN=$RUNNER_TEMP/p18-bin/$name/saiife" >> "$GITHUB_ENV"
      - name: install the pinned nfpm
        shell: bash
        run: |
          set -euo pipefail
          # The runner is x86_64 for both rows; nfpm cross-packages by arch.
          # shellcheck source=/dev/null
          . packaging/linux/nfpm.version
          tgz="nfpm_${version}_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${version}/${tgz}"
          echo "${sha256_linux_x86_64}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p18-nfpm"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/p18-nfpm" nfpm
          echo "$RUNNER_TEMP/p18-nfpm" >> "$GITHUB_PATH"
      # Secrets reach only tag pushes, so PR runs build unsigned packages.
      - name: stage the rpm signing key
        shell: bash
        env:
          PKG_GPG_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PKG_GPG_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PKG_GPG_PRIVATE_KEY" ]; then
            echo "::notice::packages are unsigned (PKG_GPG_PRIVATE_KEY not set)"
            exit 0
          fi
          keyfile="$RUNNER_TEMP/p18-pkg-key.asc"
          (umask 077 && printf '%s\n' "$PKG_GPG_PRIVATE_KEY" > "$keyfile")
          echo "SAIIFE_PKG_GPG_KEY_FILE=$keyfile" >> "$GITHUB_ENV"
      - name: build the deb and rpm
        shell: bash
        env:
          NFPM_RPM_PASSPHRASE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PKG_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          bash packaging/linux/build.sh "$SAIIFE_BIN" "$VERSION" "$ARCH" pkg
          ls -l pkg
      # With a key, an unsigned rpm is a failed release, never a quiet one.
      - name: check the rpm signature
        if: env.SAIIFE_PKG_GPG_KEY_FILE != ''
        shell: bash
        run: |
          set -euo pipefail
          command -v rpm >/dev/null || { sudo apt-get update && sudo apt-get install -y rpm; }
          shopt -s nullglob
          rpms=(pkg/*.rpm)
          [ "${#rpms[@]}" -eq 1 ] || { echo "::error::expected 1 rpm in pkg, found ${#rpms[@]}"; exit 1; }
          # nfpm adds a header (RSAHEADER/DSAHEADER) and a header+payload
          # (SIGPGP/SIGGPG) signature; an unsigned rpm has neither.
          hdr="$(rpm -qp --nosignature --qf '%{RSAHEADER:pgpsig}|%{DSAHEADER:pgpsig}' "${rpms[0]}")"
          body="$(rpm -qp --nosignature --qf '%{SIGPGP:pgpsig}|%{SIGGPG:pgpsig}' "${rpms[0]}")"
          echo "header signature: $hdr"
          echo "header+payload signature: $body"
          if [ "$hdr" = '(none)|(none)' ] || [ "$body" = '(none)|(none)' ]; then
            echo "::error::${rpms[0]} is not signed, but PKG_GPG_PRIVATE_KEY is set"
            exit 1
          fi
      - name: remove the signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/p18-pkg-key.asc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.arch }}
          path: pkg/*
          if-no-files-found: error

  # One pkg per architecture from the thin binaries the build job signed:
  # `system install` refuses a universal binary. An unsigned pkg is built as a
  # check and never published; a failed signing or notarization fails the
  # release.
  macos-pkg:
    needs: [check-version, build]
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.pkgs.outputs.signed }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*-apple-darwin
          path: dist
          merge-multiple: true
      # Secrets exist only on v* tag pushes: PRs and branch runs get empty
      # strings and build the unsigned pkg. The installer pair is all or none;
      # build-pkg.sh fails on half a set.
      - id: pkgs
        name: build the pkgs
        shell: bash
        env:
          MACOS_INSTALLER_CERT_P12: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_INSTALLER_CERT_P12 || '' }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_INSTALLER_CERT_PASSWORD || '' }}
          MACOS_SIGN_P12_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_P12_BASE64 || '' }}
          MACOS_SIGN_P12_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_P12_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_NOTARY_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_NOTARY_APPLE_ID || '' }}
          APPLE_NOTARY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_NOTARY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          signed=true
          for row in x86_64-apple-darwin:x86_64 aarch64-apple-darwin:arm64; do
            target="${row%%:*}"
            arch="${row##*:}"
            name="saiife-$VERSION-$target"
            mkdir -p "$RUNNER_TEMP/p18b-bin"
            # The packaged bytes are the tarball's bytes.
            tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP/p18b-bin" "$name/saiife"
            pkg="$(bash packaging/macos/build-pkg.sh "$RUNNER_TEMP/p18b-bin/$name/saiife" "$VERSION" "$arch" pkg-out)"
            echo "built $pkg ($(cat "$pkg.mode"))"
            if [ "$(cat "$pkg.mode")" != signed ]; then signed=false; fi
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - name: upload the signed pkgs
        if: steps.pkgs.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pkg-signed
          path: pkg-out/*.pkg
          if-no-files-found: error

  # The MSIs and the Intune Win32 packages (plan 19b Task 13). The MSI wraps the exe the
  # build job already signed, then is signed itself in artifact-signing mode (the same gate
  # and action as the exe: secrets exist only on v* tag refs). The .intunewin is built from
  # the signed MSI. Without the secrets the MSI is unsigned, the job stays green, and the
  # release notes say so.
  windows-msi:
    needs: [check-version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-2025
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist
      # The packaged bytes are the zip's bytes, signed exe included.
      - name: unpack saiife.exe from the zip
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'p19b-msi-exe'
          Expand-Archive -LiteralPath "dist/saiife-$env:VERSION-$env:TARGET.zip" -DestinationPath $dest
          $exe = Get-ChildItem -Recurse -Filter saiife.exe $dest | Select-Object -First 1
          if ($null -eq $exe) { Write-Output '::error::no saiife.exe in the zip'; exit 1 }
          "SAIIFE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: build the MSI
        shell: pwsh
        run: ./scripts/package-windows/build.ps1 -Target $env:TARGET -Version $env:VERSION -Exe $env:SAIIFE_EXE -OutDir dist -Only msi
      - name: signing mode (MSI)
        id: msisign
        shell: bash
        env:
          WINDOWS_SIGN_AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_TENANT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_ID || '' }}
          WINDOWS_SIGN_AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_SECRET || '' }}
          WINDOWS_SIGN_ENDPOINT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ENDPOINT || '' }}
          WINDOWS_SIGN_ACCOUNT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ACCOUNT || '' }}
          WINDOWS_SIGN_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PROFILE || '' }}
          MSI_ARCH: ${{ matrix.arch }}
        # Writes dist/SIGNING-msi-<arch>.txt, which the publish job reads.
        run: bash scripts/release/windows-sign-mode.sh "msi-$MSI_ARCH"
      - name: sign (MSI)
        if: steps.msisign.outputs.mode == 'artifact-signing'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_ID || '' }}
          azure-client-secret: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_AZURE_CLIENT_SECRET || '' }}
          endpoint: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ENDPOINT || '' }}
          signing-account-name: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ACCOUNT || '' }}
          certificate-profile-name: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PROFILE || '' }}
          cache-dependencies: 'false'
          files: ${{ github.workspace }}\dist\saiife-${{ needs.check-version.outputs.version }}-${{ matrix.arch }}.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: signtool verify (MSI)
        if: steps.msisign.outputs.mode == 'artifact-signing'
        shell: pwsh
        env:
          MSI_ARCH: ${{ matrix.arch }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if ($null -eq $signtool) { Write-Output '::error::signtool.exe not found'; exit 1 }
          & $signtool.FullName verify /pa /v "dist/saiife-$env:VERSION-$env:MSI_ARCH.msi"
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::signtool verify failed'; exit 1 }
      - name: build the .intunewin from the MSI
        shell: pwsh
        run: ./scripts/package-windows/build.ps1 -Target $env:TARGET -Version $env:VERSION -OutDir dist -Only intunewin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-windows-msi-${{ matrix.arch }}
          path: |
            dist/saiife-${{ needs.check-version.outputs.version }}-${{ matrix.arch }}.msi
            dist/saiife-${{ needs.check-version.outputs.version }}-${{ matrix.arch }}.intunewin
            dist/SIGNING-msi-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    needs: [check-version, build, linux-packages, macos-pkg, windows-msi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: download the signed macOS pkgs
        if: needs.macos-pkg.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-pkg-signed
          path: dist
      - name: SHA256SUMS
        shell: bash
        env:
          PKG_SIGNED: ${{ needs.macos-pkg.outputs.signed }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          count="$(ls -1 saiife-*.tar.gz | wc -l)"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 tarballs, found $count"
            exit 1
          fi
          shopt -s nullglob
          debs=(saiife_*.deb)
          rpms=(saiife-*.rpm)
          pkgs=(saiife-*.pkg)
          shopt -u nullglob
          if [ "${#debs[@]}" -ne 2 ] || [ "${#rpms[@]}" -ne 2 ]; then
            echo "::error::expected 2 debs and 2 rpms, found ${#debs[@]} and ${#rpms[@]}"
            exit 1
          fi
          zips="$(ls -1 saiife-*.zip | wc -l)"
          if [ "$zips" -ne 2 ]; then
            echo "::error::expected 2 Windows zips, found $zips"
            exit 1
          fi
          msis="$(ls -1 saiife-*.msi | wc -l)"
          intunewins="$(ls -1 saiife-*.intunewin | wc -l)"
          if [ "$msis" -ne 2 ] || [ "$intunewins" -ne 2 ]; then
            echo "::error::expected 2 MSIs and 2 .intunewin files, found $msis and $intunewins"
            exit 1
          fi
          want_pkgs=0
          if [ "$PKG_SIGNED" = true ]; then want_pkgs=2; fi
          if [ "${#pkgs[@]}" -ne "$want_pkgs" ]; then
            echo "::error::expected $want_pkgs signed pkgs, found ${#pkgs[@]}"
            exit 1
          fi
          sha256sum saiife-*.tar.gz saiife_*.deb saiife-*.rpm saiife-*.zip saiife-*.msi saiife-*.intunewin ${pkgs[@]+"${pkgs[@]}"} | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: sign SHA256SUMS
        shell: bash
        env:
          PKG_GPG_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PKG_GPG_PRIVATE_KEY || '' }}
          PKG_GPG_PASSPHRASE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PKG_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PKG_GPG_PRIVATE_KEY" ]; then
            echo "::notice::packages are unsigned (PKG_GPG_PRIVATE_KEY not set)"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d -p "$RUNNER_TEMP")"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$PKG_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # The passphrase goes in on stdin, never on argv.
          printf '%s' "$PKG_GPG_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor -o dist/SHA256SUMS.asc dist/SHA256SUMS
          ls -l dist/SHA256SUMS.asc
      - name: release notes
        shell: bash
        run: |
          set -euo pipefail
          : > notes.md
          : > heading.txt
          if [ -f CHANGELOG.md ]; then
            # The section body goes to notes.md, without its "## <version>"
            # heading: the release title already carries the version.
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; print > "heading.txt"; next } }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for version $VERSION; add '## $VERSION' release notes before tagging"
            exit 1
          fi
          if grep -q 'YYYY-MM-DD' heading.txt notes.md; then
            echo "::error::CHANGELOG.md still has the YYYY-MM-DD placeholder; set the release date before tagging"
            exit 1
          fi
          # One SIGNING-<target>.txt per macOS build: a missing one must
          # not drop the ad-hoc note silently.
          shopt -s nullglob
          signing=(dist/SIGNING-*-apple-darwin.txt)
          wsigning=(dist/SIGNING-*-windows-msvc.txt)
          msisigning=(dist/SIGNING-msi-*.txt)
          shopt -u nullglob
          if [ "${#signing[@]}" -ne 2 ]; then
            echo "::error::expected 2 macOS SIGNING-*.txt files, found ${#signing[@]}: ${signing[*]}"
            exit 1
          fi
          if [ "${#wsigning[@]}" -ne 2 ]; then
            echo "::error::expected 2 Windows SIGNING-*.txt files, found ${#wsigning[@]}: ${wsigning[*]}"
            exit 1
          fi
          for f in "${wsigning[@]}"; do
            case "$(cat "$f")" in
              unsigned | artifact-signing) ;;
              *) echo "::error::$f holds '$(cat "$f")', want unsigned or artifact-signing"; exit 1 ;;
            esac
          done
          if grep -qx 'unsigned' "${wsigning[@]}"; then
            printf '\nWindows binaries in this release are not Authenticode-signed; SmartScreen will warn on first run.\n' >> notes.md
          fi
          if [ "${#msisigning[@]}" -ne 2 ]; then
            echo "::error::expected 2 MSI SIGNING-msi-*.txt files, found ${#msisigning[@]}: ${msisigning[*]}"
            exit 1
          fi
          for f in "${msisigning[@]}"; do
            case "$(cat "$f")" in
              unsigned | artifact-signing) ;;
              *) echo "::error::$f holds '$(cat "$f")', want unsigned or artifact-signing"; exit 1 ;;
            esac
          done
          if grep -qx 'unsigned' "${msisigning[@]}"; then
            printf '\nThe Windows MSIs (and the .intunewin files built from them) in this release are not Authenticode-signed; Windows will show an unknown publisher.\n' >> notes.md
          fi
          for f in "${signing[@]}"; do
            case "$(cat "$f")" in
              ad-hoc | developer-id) ;;
              *) echo "::error::$f holds '$(cat "$f")', want ad-hoc or developer-id"; exit 1 ;;
            esac
          done
          if grep -qx 'ad-hoc' "${signing[@]}"; then
            printf '\nmacOS binaries in this release are ad-hoc signed and not notarized.\n' >> notes.md
          fi
          if ! ls dist/saiife-*.pkg >/dev/null 2>&1; then
            printf '\nThis release has no macOS pkg: the installer signing secrets are not set.\n' >> notes.md
          fi
          cat notes.md
      # Draft first: nothing is public (or "latest") until install-test passes.
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/*.zip dist/*.msi dist/*.intunewin dist/*.deb dist/*.rpm dist/SHA256SUMS install.sh install.ps1)
          if [ -f dist/SHA256SUMS.asc ]; then
            files+=(dist/SHA256SUMS.asc)
          fi
          if ls dist/saiife-*.pkg >/dev/null 2>&1; then
            files+=(dist/saiife-*.pkg)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "saiife $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${files[@]}"

  install-test:
    needs: [check-version, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # Draft releases are only visible to tokens with push access, so reading
    # the draft's assets needs contents: write even though nothing is written.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: download the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D rel
      - name: install from the draft assets
        shell: bash
        run: |
          set -euo pipefail
          ls -l rel
          SAIIFE_DOWNLOAD_BASE="file://$PWD/rel/" SAIIFE_VERSION="$VERSION" sh rel/install.sh
      - name: codesign --verify (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --strict --verbose=2 "$HOME/.local/bin/saiife"
      - name: saiife --version
        shell: bash
        run: |
          set -euo pipefail
          out="$("$HOME/.local/bin/saiife" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::installed saiife does not report $VERSION"; exit 1 ;;
          esac

  # install.ps1 from the draft assets on Windows: checksums, install, and the
  # Authenticode state the build recorded (Valid when signed, NotSigned if not).
  install-test-windows:
    needs: [check-version, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: download the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D rel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-x86_64-pc-windows-msvc
          path: signing
      - name: install from the draft assets
        shell: pwsh
        run: |
          Get-ChildItem rel | Format-Table Name, Length
          $rel = ([System.Uri]((Resolve-Path rel).Path + '\')).AbsoluteUri
          & powershell.exe -NoProfile -File rel/install.ps1 -Version $env:VERSION -BaseUrl $rel
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: saiife --version and Authenticode state
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\saiife\bin\saiife.exe'
          $out = & $exe --version
          Write-Output $out
          if (-not ("$out" -like "*$env:VERSION*")) {
            Write-Output "::error::installed saiife does not report $env:VERSION"
            exit 1
          }
          $mode = (Get-Content signing/SIGNING-x86_64-pc-windows-msvc.txt -Raw).Trim()
          $want = if ($mode -eq 'artifact-signing') { 'Valid' } else { 'NotSigned' }
          $sig = Get-AuthenticodeSignature $exe
          Write-Output "mode=$mode Authenticode=$($sig.Status)"
          if ([string]$sig.Status -ne $want) {
            Write-Output "::error::expected Authenticode status $want, got $($sig.Status)"
            exit 1
          }

  package-test:
    needs: [check-version, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        kind: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: download the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D rel
      - name: install and remove the draft package
        shell: bash
        run: |
          set -euo pipefail
          ls -l rel
          # The runner is amd64; the draft holds both architectures.
          # build.sh writes a Cargo prerelease '-' as '~'.
          pv="$(printf '%s' "$VERSION" | tr '-' '~')"
          # With the package key in the repo, the release must be signed.
          if [ -f deploy/keys/saiife-packages.asc ]; then
            [ -f rel/SHA256SUMS.asc ] || { echo "::error::deploy/keys/saiife-packages.asc exists, but the draft has no SHA256SUMS.asc"; exit 1; }
            GNUPGHOME="$(mktemp -d -p "$RUNNER_TEMP")"
            export GNUPGHOME
            chmod 700 "$GNUPGHOME"
            gpg --batch --quiet --import deploy/keys/saiife-packages.asc
            gpg --batch --verify rel/SHA256SUMS.asc rel/SHA256SUMS
            echo "SHA256SUMS.asc verifies with deploy/keys/saiife-packages.asc"
            rm -rf "$GNUPGHOME"
            unset GNUPGHOME
          fi
          phases="fresh remove"
          if [ "$KIND" = deb ]; then
            pkg="rel/saiife_${pv}_amd64.deb"
          else
            pkg="rel/saiife-${pv}-1.x86_64.rpm"
            if [ -f deploy/keys/saiife-packages.asc ] && [ -f rel/SHA256SUMS.asc ]; then
              export SAIIFE_PKG_PUBKEY=deploy/keys/saiife-packages.asc
              phases="fresh remove signature"
            fi
          fi
          (cd rel && sha256sum -c --ignore-missing SHA256SUMS)
          SAIIFE_PACKAGE_CI=1 PHASES="$phases" \
            bash scripts/package-linux/run.sh "$KIND" rel "$pkg" "$pkg"

  release:
    needs: [install-test, install-test-windows, package-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
