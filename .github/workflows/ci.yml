name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: one failing test binary must not hide the rest.
      # A short temp base keeps unix socket paths under 108 bytes.
      # TMPDIR too: tempfile::tempdir() (and anything else using the
      # system temp dir) stays off a quota'd or shared /tmp.
      - run: cargo test --workspace --no-fail-fast
        env:
          SAIIFE_TEST_TMP: ${{ runner.temp }}/s
          TMPDIR: ${{ runner.temp }}
      # The hook path (guard, audit, policy, ipc), saiife-system and saiife-mcp must not link tokio: only
      # the daemon crate does (spec §4.2).
      - name: no tokio in hook crates
        if: matrix.os == 'ubuntu-latest'
        run: test "$(cargo tree -e normal -p saiife-guard -p saiife-audit -p saiife-policy -p saiife-ipc -p saiife-system -p saiife-mcp | grep -c tokio)" = 0
      # install.sh against a fake file:// release: checksums, latest lookup,
      # unsupported platform, PATH hint. No network.
      - name: install.sh
        run: bash scripts/test-install.sh
      # End-to-end demo in a sandboxed HOME: three recorded Claude Code calls
      # must be blocked and the HTML report written (docs/demo.md).
      - name: demo
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --quiet
          SAIIFE_BIN="$PWD/target/release/saiife" bash scripts/demo.sh
      # Live lock-check harness (scripts/live-check-locked.sh) without Docker:
      # summarizer, stub modes, the Claude/Codex/Gemini check tables, and full
      # runs against fake agents (test-lib.sh holds every offline test).
      - name: lock-check harness (offline)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/lock-check/test-lib.sh
      # The personal broker's vault key in a real Secret Service
      # (gnome-keyring, throwaway HOME and keyring). CI only.
      - name: personal broker Secret Service smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-tools dbus python3-secretstorage
          cargo build --quiet --bin saiife
          SAIIFE_BIN="$PWD/target/debug/saiife" bash scripts/personal-broker/ss-smoke.sh

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./scripts/test-offline.sh
        env:
          SAIIFE_TEST_TMP: ${{ runner.temp }}/s
          TMPDIR: ${{ runner.temp }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck --version
      - run: shellcheck install.sh scripts/*.sh scripts/lock-check/*.sh scripts/lock-check/testdata/*.sh scripts/locked-linux/*.sh scripts/personal-broker/*.sh packaging/linux/build.sh
      - run: shellcheck -s sh packaging/linux/scripts/* deploy/intune/linux/discovery.sh
      - run: shellcheck -x scripts/package-linux/run.sh scripts/package-linux/deb.sh
      - run: shellcheck -s sh scripts/package-linux/rpm-container.sh

  # Lint only: the Ansible role is never run in CI (plan 18, task 5).
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pipx run --spec ansible-lint==26.10.1 ansible-lint deploy/ansible

  # Locked mode on real machines (spec §13 "Daemon integration"): `system
  # install` as root, the §5.2 owners and modes, managed hooks run as an
  # unprivileged agent user, the fail-closed matrix (§9.3), attacks on the
  # installed files, doctor, reinstall, uninstall and purge. systemd 249
  # (22.04, plain vault key file) and 255 (24.04, encrypted credential).
  # The only place anything privileged runs: run.sh refuses outside GitHub
  # Actions and calls sudo itself (the runner has passwordless sudo).
  locked-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      # rust-toolchain.toml selects the toolchain; make sure it has the target.
      - run: rustup target add x86_64-unknown-linux-musl
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # jq and polkit for the approvals phase of scripts/locked-linux: 24.04
      # has polkitd (and pkexec), 22.04 only policykit-1.
      - name: install jq and polkit
        run: sudo apt-get install -y jq polkitd pkexec || sudo apt-get install -y jq policykit-1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Static (musl), like the release, but with debug assertions on: the
      # SAIIFE_EVAL_FAULT test seam exists only there. run.sh installs it
      # with --allow-test-build (spec §9.2 A4: never in production).
      - run: cargo build --locked --profile ci-locked --target x86_64-unknown-linux-musl --bin saiife
      - name: install, fail-closed matrix, uninstall (sudo inside, this job only)
        env:
          SAIIFE_LOCKED_CI: "1"
          SAIIFE_LOCKED_LOGS: ${{ github.workspace }}/target/locked-linux-logs
        run: bash scripts/locked-linux/run.sh "$PWD/target/x86_64-unknown-linux-musl/ci-locked/saiife"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-linux-logs-${{ matrix.os }}
          path: target/locked-linux-logs
          if-no-files-found: ignore
          retention-days: 7

  # The deb and rpm (plan 18, Task 3): install (and its refusal), a fleet
  # config change, upgrade, remove, purge and lintian on real Ubuntu
  # runners; the rpm in a Rocky 9 container (locked mode refuses containers,
  # so that row covers payload, scriptlets, refusal, upgrade and removal).
  # Like locked-linux, scripts/package-linux/run.sh refuses outside GitHub
  # Actions and calls sudo itself. The binary is the strict release build.
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, kind: deb }
          - { os: ubuntu-24.04, kind: deb }
          - { os: ubuntu-24.04, kind: rpm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: rustup target add x86_64-unknown-linux-musl
      - name: install musl-tools and jq
        run: sudo apt-get update && sudo apt-get install -y musl-tools jq
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p saiife
      - name: install nfpm (pinned, sha256 checked)
        run: |
          set -euo pipefail
          v="$(sed -n 's/^version=//p' packaging/linux/nfpm.version)"
          sum="$(sed -n 's/^sha256_linux_x86_64=//p' packaging/linux/nfpm.version)"
          [ -n "$v" ] && [ -n "$sum" ]
          tgz="$RUNNER_TEMP/nfpm.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/goreleaser/nfpm/releases/download/v${v}/nfpm_${v}_Linux_x86_64.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/nfpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/nfpm-bin" nfpm
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      # old = the cargo version; new = the same build with an extra ELF
      # section, so its bytes differ and it stays static (upgrade phase).
      - name: build the old and the new package
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/saiife
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "saiife") | .version')"
          printf 'upgrade' > "$RUNNER_TEMP/p18-t3-ci-section"
          objcopy --add-section .saiife_ci="$RUNNER_TEMP/p18-t3-ci-section" "$bin" "$RUNNER_TEMP/saiife-ci1"
          rm -rf dist
          bash packaging/linux/build.sh "$bin" "$ver" amd64 dist
          bash packaging/linux/build.sh "$RUNNER_TEMP/saiife-ci1" "${ver}+ci1" amd64 dist
          # build.sh writes a Cargo prerelease '-' as '~'.
          pv="$(printf '%s' "$ver" | tr '-' '~')"
          ext="${{ matrix.kind }}"
          if [ "$ext" = deb ]; then
            echo "OLD_PKG=dist/saiife_${pv}_amd64.deb" >> "$GITHUB_ENV"
            echo "NEW_PKG=dist/saiife_${pv}+ci1_amd64.deb" >> "$GITHUB_ENV"
          else
            echo "OLD_PKG=dist/saiife-${pv}-1.x86_64.rpm" >> "$GITHUB_ENV"
            echo "NEW_PKG=dist/saiife-${pv}+ci1-1.x86_64.rpm" >> "$GITHUB_ENV"
          fi
          ls -l dist
      - name: install, upgrade, remove (sudo inside, this job only)
        env:
          SAIIFE_PACKAGE_CI: "1"
          SAIIFE_PACKAGE_LOGS: ${{ github.workspace }}/target/package-linux-logs
        run: bash scripts/package-linux/run.sh "${{ matrix.kind }}" dist "$OLD_PKG" "$NEW_PKG"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-logs-${{ matrix.os }}-${{ matrix.kind }}
          path: target/package-linux-logs
          if-no-files-found: ignore
          retention-days: 7

  # The released 0.1.0 binary must still read a v2 (chained) log: no skipped
  # lines, one row per fixture line. 0.1.0 ignores a relative SAIIFE_AUDIT_DIR,
  # so the path is absolute.
  compat-v010:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 0.1.0 reads a v2 log
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          asset=saiife-0.1.0-x86_64-unknown-linux-musl
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$asset.tar.gz" \
            "https://github.com/HrRobinson/saiife/releases/download/v0.1.0/$asset.tar.gz"
          echo "3f5b0d344794d880f87a62c4c30d96166d885046d688e7d09e9312b09a6e1e93  $work/$asset.tar.gz" | sha256sum -c -
          tar -xzf "$work/$asset.tar.gz" -C "$work" --strip-components=1 "$asset/saiife"
          for fixture in v2 v2-locked; do
            dir="$PWD/crates/audit/tests/fixtures/$fixture"
            echo "== $fixture"
            status=0
            SAIIFE_AUDIT_DIR="$dir" HOME="$(mktemp -d)" \
              "$work/saiife" audit >"$work/out" 2>"$work/err" || status=$?
            cat "$work/out"; cat "$work/err"
            test "$status" -eq 0
            # 0.1.0 wording: "N unreadable lines skipped" (stdout) and
            # "... unreadable log lines were skipped ..." (stderr).
            if grep -q unreadable "$work/out" "$work/err"; then
              echo "0.1.0 reported unreadable lines in $fixture"
              exit 1
            fi
            # 0.1.0 lists every line as a row, bookkeeping records included.
            rows="$(grep -c '^2026-' "$work/out")"
            lines="$(cat "$dir"/*.jsonl | wc -l)"
            test "$rows" -eq "$lines"
          done

  # Fuzzing: 60 s per target on every push; the long run is
  # fuzz-nightly.yml. libFuzzer needs a nightly toolchain, pinned by date.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Beats rust-toolchain.toml (stable).
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      # cargo-fuzz 0.12.0's locked rustix does not build on this nightly;
      # install it with stable. The fuzz runs below keep nightly.
      - run: rustup toolchain install stable --profile minimal
      - name: install cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install cargo-fuzz --locked --version 0.12.0
      - name: fuzz each target for 60 s
        run: |
          set -euo pipefail
          for t in ipc_frame proxy_path params gateway_request; do
            cargo fuzz run "$t" -- -max_total_time=60
          done
      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
