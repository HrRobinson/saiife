name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: one failing test binary must not hide the rest.
      # A short temp base keeps unix socket paths under 108 bytes.
      # TMPDIR too: tempfile::tempdir() (and anything else using the
      # system temp dir) stays off a quota'd or shared /tmp.
      # On windows-latest (plan 19a) TMP, TEMP and LOCALAPPDATA sit under the
      # runner temp dir too, so no test writes the runner's real profile
      # paths that honour them; the other OSes ignore the three. USERPROFILE is
      # not set here: cargo and rustup find their own homes through it. Each test
      # child sets it instead (`common::set_profile`).
      - run: cargo test --workspace --no-fail-fast
        env:
          SAIIFE_TEST_TMP: ${{ runner.temp }}/s
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          LOCALAPPDATA: ${{ runner.temp }}/localappdata
      # The co-signer's macOS asker reads XNU's private pcblist_n layout (plan 21, D4):
      # its live test, on its own line, so a macOS that changes the layout is named here.
      - name: pcblist_n layout (live)
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: cargo test -p saiife-darwin -- --exact macos::tests::own_connection_has_own_uid
        env:
          TMPDIR: ${{ runner.temp }}
      - name: release signing script (offline)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/release/test-macos-sign.sh
      - name: Windows signing mode (offline)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/release/test-windows-sign-mode.sh
      # The Windows steps below run after a failed step too, so one run reports
      # them all; a failed step still fails the job.
      # install.ps1 against a fake file:// release (parses both scripts first).
      - name: install.ps1 (PowerShell 7)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: ./scripts/test-install.ps1
      # Windows PowerShell 5.1 is what users have.
      - name: install.ps1 (Windows PowerShell 5.1)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: powershell
        run: ./scripts/test-install.ps1
      # The developer hook's p95 against D10's budget (plan 19a). Over it is an
      # owner decision, not a silent raise.
      - name: developer hook bench (Windows, p95 budget)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: bash
        run: BENCH_MAX_P95_MS=130 bash scripts/bench-check.sh 130
      # The guard's readers against the real shells: [Parser]::ParseInput and
      # harmless cmd.exe probes. Any mismatch fails. Only a debug build has
      # the seam it reads with.
      - name: build for the reader differential (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: bash
        run: cargo build --locked -p saiife --bin saiife
      - name: reader differential (PowerShell 7)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: ./scripts/differential-windows.ps1 -Saiife target/debug/saiife.exe
      - name: reader differential (Windows PowerShell 5.1)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: powershell
        run: ./scripts/differential-windows.ps1 -Saiife target/debug/saiife.exe
      # The locked-windows scripts (plan 19b): every .ps1 parses, and run.ps1 refuses
      # (exit 2, nothing done) with SAIIFE_LOCKED_CI unset or outside Actions. The
      # lock-check VM harness parses and refuses without SAIIFE_LOCKCHECK_WINDOWS_VM.
      - name: locked-windows scripts parse, run.ps1 refuses
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Remove-Item Env:SAIIFE_LOCKCHECK_WINDOWS_VM -ErrorAction SilentlyContinue
          $out = pwsh -NoProfile -File ./scripts/lock-check/windows-vm.ps1 -Agent claude
          if ($LASTEXITCODE -ne 2 -or "$out" -notlike 'refusing:*') { Write-Output "windows-vm.ps1: exit $LASTEXITCODE`: $out"; exit 1 }
          foreach ($file in @(Get-ChildItem scripts/locked-windows/*.ps1) + @(Get-Item scripts/lock-check/windows-vm.ps1)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Output "$($file.Name): $_" }; exit 1 }
          }
          Remove-Item Env:SAIIFE_LOCKED_CI -ErrorAction SilentlyContinue
          $out = pwsh -NoProfile -File ./scripts/locked-windows/run.ps1 -Binary "$PWD\README.md"
          if ($LASTEXITCODE -ne 2 -or "$out" -notlike 'refusing:*') { Write-Output "exit $LASTEXITCODE`: $out"; exit 1 }
          $env:SAIIFE_LOCKED_CI = '1'
          $env:GITHUB_ACTIONS = 'false'
          $out = pwsh -NoProfile -File ./scripts/locked-windows/run.ps1
          if ($LASTEXITCODE -ne 2 -or "$out" -notlike 'refusing:*') { Write-Output "exit $LASTEXITCODE`: $out"; exit 1 }
          # Plan 21: forge-allow.ps1 hashes a payload's input as the hook does
          # (crates/ipc/src/hookkey.rs key_of_the_claude_fixture). -KeyOnly connects to nothing.
          $want = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes('{"command":"ls -la","description":"List files"}'))).ToLowerInvariant()
          $got = pwsh -NoProfile -File ./scripts/locked-windows/forge-allow.ps1 -Payload crates/cli/tests/fixtures/claude/bash-allow.json -KeyOnly
          if ($LASTEXITCODE -ne 0 -or "$got".Trim() -ne $want) { Write-Output "forge-allow.ps1 -KeyOnly: exit $LASTEXITCODE`: $got, want $want"; exit 1 }
          exit 0
      # The macOS managed hook against a live `daemon --system` (plan 13):
      # p95 of 50 calls per payload within 40 ms. The script needs bash 5
      # (EPOCHREALTIME); the runner's /bin/bash is 3.2, so Homebrew's.
      - name: managed hook bench (macOS, p95 budget)
        if: runner.os == 'macOS'
        run: |
          bash5="$(brew --prefix)/bin/bash"
          [ -x "$bash5" ] || brew install bash
          # Gating again since plan 21 (owner ruling 6): 40 ms p95 on macOS.
          BENCH_MAX_P95_MS=40 "$bash5" scripts/bench-check.sh --managed 50
      # The hook path (guard, audit, policy, ipc), saiife-system, saiife-mcp, saiife-darwin and saiife-win must not
      # link tokio: only the daemon crate does (spec §4.2). Both OSes, so macOS-only deps count too.
      - name: no tokio in hook crates
        if: ${{ success() || (!cancelled() && matrix.os == 'windows-latest') }}
        shell: bash
        run: test "$(cargo tree -e normal -p saiife-guard -p saiife-audit -p saiife-policy -p saiife-ipc -p saiife-system -p saiife-mcp -p saiife-darwin -p saiife-win -p saiife-dev | grep -c tokio)" = 0
      # unsafe only in crates/darwin and crates/win/src/ffi; every other crate root forbids it (plan 13, decision 1; plan 19a, W1).
      - name: unsafe only in saiife-darwin and saiife-win's ffi
        if: matrix.os != 'windows-latest'
        run: bash scripts/check-unsafe.sh
      # Windows code compile-checked from Linux, with a stand-in C compiler (plan 19a).
      - name: windows target check
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-pc-windows-msvc
          bash scripts/check-windows.sh
      # install.sh against a fake file:// release: checksums, latest lookup,
      # unsupported platform, PATH hint. No network.
      - name: install.sh
        if: matrix.os != 'windows-latest'
        run: bash scripts/test-install.sh
      # End-to-end demo in a sandboxed HOME: three recorded Claude Code calls
      # must be blocked and the HTML report written (docs/demo.md).
      - name: demo
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --quiet
          SAIIFE_BIN="$PWD/target/release/saiife" bash scripts/demo.sh
      # Live lock-check harness (scripts/live-check-locked.sh) without Docker:
      # summarizer, stub modes, the Claude/Codex/Gemini check tables, and full
      # runs against fake agents (test-lib.sh holds every offline test).
      - name: lock-check harness (offline)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/lock-check/test-lib.sh
      # The personal broker's vault key in a real Secret Service
      # (gnome-keyring, throwaway HOME and keyring). CI only.
      - name: personal broker Secret Service smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-tools dbus python3-secretstorage
          cargo build --quiet --bin saiife
          SAIIFE_BIN="$PWD/target/debug/saiife" bash scripts/personal-broker/ss-smoke.sh

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./scripts/test-offline.sh
        env:
          SAIIFE_TEST_TMP: ${{ runner.temp }}/s
          TMPDIR: ${{ runner.temp }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck --version
      - run: shellcheck install.sh scripts/*.sh scripts/lock-check/*.sh scripts/lock-check/testdata/*.sh scripts/locked-linux/*.sh scripts/locked-macos/*.sh scripts/personal-broker/*.sh scripts/release/*.sh scripts/macos-pkg/*.sh packaging/linux/build.sh packaging/macos/build-pkg.sh
      - run: shellcheck -s sh packaging/linux/scripts/* packaging/macos/scripts/* deploy/intune/linux/discovery.sh deploy/intune/macos/*.sh deploy/jamf/*.sh
      - run: shellcheck -x scripts/package-linux/run.sh scripts/package-linux/deb.sh
      - run: shellcheck -s sh scripts/package-linux/rpm-container.sh

  # Lint only: the Ansible role is never run in CI (plan 18, task 5).
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pipx run --spec ansible-lint==26.10.1 ansible-lint deploy/ansible

  # Locked mode on real machines (spec §13 "Daemon integration"): `system
  # install` as root, the §5.2 owners and modes, managed hooks run as an
  # unprivileged agent user, the fail-closed matrix (§9.3), attacks on the
  # installed files, doctor, reinstall, uninstall and purge. systemd 249
  # (22.04, plain vault key file) and 255 (24.04, encrypted credential).
  # The only place anything privileged runs: run.sh refuses outside GitHub
  # Actions and calls sudo itself (the runner has passwordless sudo).
  locked-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      # rust-toolchain.toml selects the toolchain; make sure it has the target.
      - run: rustup target add x86_64-unknown-linux-musl
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # jq and polkit for the approvals phase of scripts/locked-linux: 24.04
      # has polkitd (and pkexec), 22.04 only policykit-1.
      - name: install jq and polkit
        run: sudo apt-get install -y jq polkitd pkexec || sudo apt-get install -y jq policykit-1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Static (musl), like the release, but with debug assertions on: the
      # SAIIFE_EVAL_FAULT test seam exists only there. run.sh installs it
      # with --allow-test-build (spec §9.2 A4: never in production).
      - run: cargo build --locked --profile ci-locked --target x86_64-unknown-linux-musl --bin saiife
      # Plan 21: the forger hashes a payload's input as the hook does (crates/ipc/src/hookkey.rs
      # key_of_the_claude_fixture), or phase_forge would forge nothing. It only reads a file.
      - name: forge-allow.py computes the hook's key
        run: |
          want="$(printf '%s' '{"command":"ls -la","description":"List files"}' | sha256sum | cut -d' ' -f1)"
          got="$(python3 -I scripts/locked-linux/forge-allow.py key crates/cli/tests/fixtures/claude/bash-allow.json)"
          [ "$got" = "$want" ] || { echo "forge-allow.py key: $got, want $want"; exit 1; }
      # Plan 20 phases need python3 (ptrace-probe.py) and curl (the co-signer):
      # both are on the ubuntu runner images. Plan 21's phase_forge uses forge-allow.py.
      - name: install, 0711 and ptrace, co-signer, forged allow, fail-closed matrix, uninstall (sudo inside, this job only)
        env:
          SAIIFE_LOCKED_CI: "1"
          SAIIFE_LOCKED_LOGS: ${{ github.workspace }}/target/locked-linux-logs
        run: bash scripts/locked-linux/run.sh "$PWD/target/x86_64-unknown-linux-musl/ci-locked/saiife"
      # The managed hook's p95 (plan 20 adds the hook.begin round trip to it),
      # It times the ci-locked build above (only a build
      # with debug assertions lets a daemon serve a hook of its own user),
      # starts its own daemon in a scratch dir, fails unless every call
      # allows, and prints the median and p95 per payload and each step's median.
      # Gating again since plan 21 (owner ruling 6), with a budget set from
      # measurements ("real budgets from measurements"): plan 21's CI runs on
      # ubuntu-24.04 measured the managed bash p95 at 41.2 to 50.0 ms (45.1 ms
      # on run 42673682022), so Linux gets 60 ms p95. macOS measured under
      # 40 ms and keeps 40; Windows measured 59.1 (2022) and 59.6 ms (2025)
      # against its 130 ms budget.
      - name: managed hook bench (Linux, p95 budget)
        run: SAIIFE_BENCH_BIN="$PWD/target/x86_64-unknown-linux-musl/ci-locked/saiife" BENCH_MAX_P95_MS=60 bash scripts/bench-check.sh --managed 50
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-linux-logs-${{ matrix.os }}
          path: target/locked-linux-logs
          if-no-files-found: ignore
          retention-days: 7

  # Locked mode on real Macs (plan 13): `system install` as root, the §5.3
  # owners and modes, managed hooks as an unprivileged agent account, the
  # fail-closed matrix (launchd bootout, SIGKILL and KeepAlive), attacks on
  # the install including DYLD_INSERT_LIBRARIES against the hardened
  # runtime (A4), doctor, approvals from a second account, lockdown,
  # reinstall, uninstall and purge. Apple silicon (macos-15) and Intel
  # (macos-15-intel). run.sh refuses outside GitHub Actions on macOS and
  # calls sudo itself (the runner has passwordless sudo).
  locked-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Debug assertions on (the SAIIFE_EVAL_FAULT seam), like locked-linux.
      - run: cargo build --locked --profile ci-locked --bin saiife
      # Ad hoc, with the hardened runtime: dyld then ignores DYLD_* for the
      # hook. run.sh installs it with --allow-test-build (never production).
      - name: sign ad hoc with the hardened runtime
        run: codesign --force --options runtime --sign - target/ci-locked/saiife
      - name: install, co-signer, fail-closed matrix, attacks, uninstall (sudo inside, this job only)
        env:
          SAIIFE_LOCKED_CI: "1"
          SAIIFE_LOCKED_LOGS: ${{ github.workspace }}/target/locked-macos-logs
        run: bash scripts/locked-macos/run.sh "$PWD/target/ci-locked/saiife"
      # daemon.log, /etc/saiife, the audit, the plist and `launchctl print`
      # (run.sh copies them on a failure; never the keys in /var/db/saiife).
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-macos-logs-${{ matrix.os }}
          path: target/locked-macos-logs
          if-no-files-found: ignore
          retention-days: 7

  # Locked mode on real Windows (plan 19b, W23): install, the service, the pipe, the hook,
  # doctor, attacks from a second account, approvals, uninstall. Elevated on a throwaway
  # runner; like locked-macos, run.ps1 refuses anywhere else. No secrets. The parse and the
  # refusal run in `test (windows-latest)`. The measurements (T10 review: TerminateProcess
  # on the hook, share mode 0 on saiife.exe, DefineDosDevice on C:) are reported, never
  # asserted, and uploaded pass or fail.
  locked-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Debug assertions on, like locked-macos; the static CRT and the load flag come from
      # .cargo/config.toml.
      - run: cargo build --locked --profile ci-locked --bin saiife
      - name: install, ACLs, fail-closed, attacks, measurements, co-signer, approvals, uninstall
        env:
          SAIIFE_LOCKED_LOGS: ${{ github.workspace }}\target\locked-windows-logs
        run: |
          $env:SAIIFE_LOCKED_CI = '1'
          ./scripts/locked-windows/run.ps1 -Binary "$PWD\target\ci-locked\saiife.exe"
      # What the owner reads, pass or fail: the measurements and the real descriptors.
      - name: upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-windows-measurements-${{ matrix.os }}
          path: target/locked-windows-logs/measurements.txt
          if-no-files-found: warn
          retention-days: 30
      # log, etc, the audit, sc.exe qc and sdshow and the phase logs (run.ps1 copies them on a
      # failure; never state, which holds the keys).
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-windows-logs-${{ matrix.os }}
          path: target/locked-windows-logs
          if-no-files-found: ignore
          retention-days: 7

  # The pkg on real Macs (plan 18, Task 7): build, payload, the Jamf fleet
  # files, installer and its SIP refusal, the fleet install from the staging
  # copy, doctor, the MDM attributes, the Jamf uninstall and a reinstall. The
  # ci-locked build: the runners have SIP off and a release binary never
  # honours the SIP seam, so it could only prove the refusal. Like
  # locked-macos, run.sh refuses outside GitHub Actions on macOS and calls
  # sudo itself. No secrets here: the pkg is unsigned.
  macos-pkg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --profile ci-locked --bin saiife
      - name: sign ad hoc with the hardened runtime
        run: codesign --force --options runtime --sign - target/ci-locked/saiife
      - name: build, install, uninstall and reinstall the pkg (sudo inside, this job only)
        env:
          SAIIFE_PACKAGE_CI: "1"
          SAIIFE_PACKAGE_LOGS: ${{ github.workspace }}/target/macos-pkg-logs
        run: bash scripts/macos-pkg/run.sh "$PWD/target/ci-locked/saiife"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pkg-logs-${{ matrix.os }}
          path: target/macos-pkg-logs
          if-no-files-found: ignore
          retention-days: 7

  # The deb and rpm (plan 18, Task 3): install (and its refusal), a fleet
  # config change, upgrade, remove, purge and lintian on real Ubuntu
  # runners; the rpm in a Rocky 9 container (locked mode refuses containers,
  # so that row covers payload, scriptlets, refusal, upgrade and removal).
  # Like locked-linux, scripts/package-linux/run.sh refuses outside GitHub
  # Actions and calls sudo itself. The binary is the strict release build.
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, kind: deb }
          - { os: ubuntu-24.04, kind: deb }
          - { os: ubuntu-24.04, kind: rpm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: rustup target add x86_64-unknown-linux-musl
      - name: install musl-tools and jq
        run: sudo apt-get update && sudo apt-get install -y musl-tools jq
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p saiife
      # Pinned downloads are cached, keyed on the pinned SHA-256, because GitHub release
      # downloads can fail for hours. The SHA-256 check runs on a cache hit too, so a bad
      # entry fails the job; a miss downloads with retries. Saved only after the check.
      - name: read the nfpm pin
        id: nfpm-pin
        run: |
          set -euo pipefail
          sum="$(sed -n 's/^sha256_linux_x86_64=//p' packaging/linux/nfpm.version)"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - name: restore the nfpm tarball
        id: nfpm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/nfpm-cache
          key: nfpm-${{ steps.nfpm-pin.outputs.sha256 }}
      - name: install nfpm (pinned, sha256 checked)
        env:
          CACHE_HIT: ${{ steps.nfpm-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          v="$(sed -n 's/^version=//p' packaging/linux/nfpm.version)"
          sum="$(sed -n 's/^sha256_linux_x86_64=//p' packaging/linux/nfpm.version)"
          [ -n "$v" ] && [ -n "$sum" ]
          mkdir -p "$RUNNER_TEMP/nfpm-cache"
          tgz="$RUNNER_TEMP/nfpm-cache/nfpm.tar.gz"
          if [ "$CACHE_HIT" = true ]; then
            echo "nfpm tarball from the cache"
          else
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o "$tgz" "https://github.com/goreleaser/nfpm/releases/download/v${v}/nfpm_${v}_Linux_x86_64.tar.gz"
          fi
          echo "$sum  $tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/nfpm-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/nfpm-bin" nfpm
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: save the nfpm tarball
        if: steps.nfpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/nfpm-cache
          key: nfpm-${{ steps.nfpm-pin.outputs.sha256 }}
      # old = the cargo version; new = the same build with an extra ELF
      # section, so its bytes differ and it stays static (upgrade phase).
      - name: build the old and the new package
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/saiife
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "saiife") | .version')"
          printf 'upgrade' > "$RUNNER_TEMP/p18-t3-ci-section"
          objcopy --add-section .saiife_ci="$RUNNER_TEMP/p18-t3-ci-section" "$bin" "$RUNNER_TEMP/saiife-ci1"
          rm -rf dist
          bash packaging/linux/build.sh "$bin" "$ver" amd64 dist
          bash packaging/linux/build.sh "$RUNNER_TEMP/saiife-ci1" "${ver}+ci1" amd64 dist
          # build.sh writes a Cargo prerelease '-' as '~'.
          pv="$(printf '%s' "$ver" | tr '-' '~')"
          ext="${{ matrix.kind }}"
          if [ "$ext" = deb ]; then
            echo "OLD_PKG=dist/saiife_${pv}_amd64.deb" >> "$GITHUB_ENV"
            echo "NEW_PKG=dist/saiife_${pv}+ci1_amd64.deb" >> "$GITHUB_ENV"
          else
            echo "OLD_PKG=dist/saiife-${pv}-1.x86_64.rpm" >> "$GITHUB_ENV"
            echo "NEW_PKG=dist/saiife-${pv}+ci1-1.x86_64.rpm" >> "$GITHUB_ENV"
          fi
          ls -l dist
      - name: install, upgrade, remove (sudo inside, this job only)
        env:
          SAIIFE_PACKAGE_CI: "1"
          SAIIFE_PACKAGE_LOGS: ${{ github.workspace }}/target/package-linux-logs
        run: bash scripts/package-linux/run.sh "${{ matrix.kind }}" dist "$OLD_PKG" "$NEW_PKG"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-logs-${{ matrix.os }}-${{ matrix.kind }}
          path: target/package-linux-logs
          if-no-files-found: ignore
          retention-days: 7

  # The Windows MSI and the Intune Win32 package (plan 19b Task 13): a refused fleet file
  # rolls the MSI back, install, upgrade (one restart, managed files unchanged), the
  # uninstall warning in msi.log, detect.ps1 and the .intunewin header. The runner is an
  # administrator and throwaway, and scripts/package-windows/test.ps1 refuses to run
  # anywhere else. No secrets: the MSI is unsigned. The release build, as package-linux
  # uses: the MSI runs `system install` with no --allow-test-build, which refuses a
  # ci-locked build (debug assertions on), so a test build could only test the rollback.
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked --bin saiife
      # The Content Prep Tool, cached as the nfpm tarball is (see package-linux). build.ps1
      # takes a copy from SAIIFE_DOWNLOAD_CACHE, checks its SHA-256 either way, and puts a
      # checked download there.
      - name: read the Content Prep Tool pin
        id: intunewin-pin
        shell: bash
        run: |
          set -euo pipefail
          sum="$(sed -n 's/^sha256=//p' scripts/package-windows/intunewin.version | tr -d '\r')"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - name: restore the Content Prep Tool
        id: intunewin-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/intunewin-cache
          key: intunewin-${{ steps.intunewin-pin.outputs.sha256 }}
      - name: build, install, upgrade and remove the MSI
        shell: pwsh
        env:
          SAIIFE_DOWNLOAD_CACHE: ${{ runner.temp }}/intunewin-cache
        run: |
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'saiife' } | Select-Object -ExpandProperty version
          ./scripts/package-windows/test.ps1 -Exe target/release/saiife.exe -Version $ver `
            -LogDir "$env:GITHUB_WORKSPACE/target/package-windows-logs" -OutDir "$env:GITHUB_WORKSPACE/target/package-windows-dist"
      - name: save the Content Prep Tool
        if: steps.intunewin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/intunewin-cache
          key: intunewin-${{ steps.intunewin-pin.outputs.sha256 }}
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows-logs
          # test.ps1 copies C:\ProgramData\saiife\log\install.log in here: upload-artifact
          # takes no path outside the workspace.
          path: target/package-windows-logs
          if-no-files-found: ignore
          retention-days: 7

  # The released 0.1.0 binary must still read a v2 (chained) log: no skipped
  # lines, one row per fixture line. 0.1.0 ignores a relative SAIIFE_AUDIT_DIR,
  # so the path is absolute.
  compat-v010:
    runs-on: ubuntu-latest
    env:
      V010_SHA256: 3f5b0d344794d880f87a62c4c30d96166d885046d688e7d09e9312b09a6e1e93
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Cached as the nfpm tarball is (see package-linux).
      - name: restore the 0.1.0 tarball
        id: v010-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/v010-cache
          key: saiife-v010-${{ env.V010_SHA256 }}
      - name: 0.1.0 reads a v2 log
        env:
          CACHE_HIT: ${{ steps.v010-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          asset=saiife-0.1.0-x86_64-unknown-linux-musl
          tgz="$RUNNER_TEMP/v010-cache/$asset.tar.gz"
          mkdir -p "$RUNNER_TEMP/v010-cache"
          if [ "$CACHE_HIT" = true ]; then
            echo "0.1.0 tarball from the cache"
          else
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o "$tgz" \
              "https://github.com/HrRobinson/saiife/releases/download/v0.1.0/$asset.tar.gz"
          fi
          echo "$V010_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$work" --strip-components=1 "$asset/saiife"
          for fixture in v2 v2-locked; do
            dir="$PWD/crates/audit/tests/fixtures/$fixture"
            echo "== $fixture"
            status=0
            SAIIFE_AUDIT_DIR="$dir" HOME="$(mktemp -d)" \
              "$work/saiife" audit >"$work/out" 2>"$work/err" || status=$?
            cat "$work/out"; cat "$work/err"
            test "$status" -eq 0
            # 0.1.0 wording: "N unreadable lines skipped" (stdout) and
            # "... unreadable log lines were skipped ..." (stderr).
            if grep -q unreadable "$work/out" "$work/err"; then
              echo "0.1.0 reported unreadable lines in $fixture"
              exit 1
            fi
            # 0.1.0 lists every line as a row, bookkeeping records included.
            rows="$(grep -c '^2026-' "$work/out")"
            lines="$(cat "$dir"/*.jsonl | wc -l)"
            test "$rows" -eq "$lines"
          done
      - name: save the 0.1.0 tarball
        if: steps.v010-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/v010-cache
          key: saiife-v010-${{ env.V010_SHA256 }}

  # Fuzzing: 60 s per target on every push; the long run is
  # fuzz-nightly.yml. libFuzzer needs a nightly toolchain, pinned by date.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Beats rust-toolchain.toml (stable).
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      # cargo-fuzz 0.12.0's locked rustix does not build on this nightly;
      # install it with stable. The fuzz runs below keep nightly.
      - run: rustup toolchain install stable --profile minimal
      - name: install cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install cargo-fuzz --locked --version 0.12.0
      - name: fuzz each target for 60 s
        run: |
          set -euo pipefail
          for t in ipc_frame proxy_path params gateway_request; do
            cargo fuzz run "$t" -- -max_total_time=60
          done
      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
