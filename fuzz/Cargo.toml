[package]
name = "saiife-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
http = "=1.5.0"
bytes = "=1.12.1"
saiife-ipc = { path = "../crates/ipc" }
saiife-broker = { path = "../crates/broker" }
saiife-daemon = { path = "../crates/daemon" }

# Its own project: not part of the workspace (the root Cargo.toml excludes it).
[workspace]

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_path"
path = "fuzz_targets/proxy_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "params"
path = "fuzz_targets/params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_request"
path = "fuzz_targets/gateway_request.rs"
test = false
doc = false
bench = false
