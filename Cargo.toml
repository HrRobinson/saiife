[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "FSL-1.1-ALv2"
repository = "https://github.com/HrRobinson/saiife"

# No unsafe anywhere: lib, bins, tests, examples and build scripts alike.
# Every crate opts in with `[lints] workspace = true`, except saiife-darwin,
# the one crate allowed unsafe (plan 13, decision 1). scripts/check-unsafe.sh
# checks that each crate keeps the opt-in.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# saiife is spawned per command by agent hooks; a small, fast binary matters.
opt-level = 3
lto = true
strip = true

# status/init hash the whole saiife binary; unoptimized SHA-256 of a debug
# binary takes seconds.
[profile.dev.package.sha2]
opt-level = 3

# The guard's latency budget (50 ms) is checked by debug-build tests; an
# unoptimized regex engine is several times slower than the shipped one.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# The CI job `locked-linux` only (built for x86_64-unknown-linux-musl): a
# static binary with debug assertions on, so its SAIIFE_EVAL_FAULT test
# seam exists, installed with `system install --allow-test-build`. Never
# for production (spec §9.2 A4). opt-level 1 keeps it small and fast enough
# for the guard's latency budget without the release build's LTO time.
[profile.ci-locked]
inherits = "release"
debug-assertions = true
overflow-checks = true
opt-level = 1
lto = false
