[package]
name = "saiife-guest"
description = "saiife guest agent: runs inside the box VM (Linux in practice, compiles everywhere)."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_guest"
path = "src/lib.rs"

[dependencies]
saiife-boxproto = { path = "../boxproto" }
# The export's delta frames (plan 39): the JSON heads and the content's
# SHA-256, as boxproto builds them (both already in the tree).
serde_json = "1"
sha2 = "0.10"
# Escaping guest paths in export errors (the shared unsafe-char predicate).
saiife-wire = { path = "../wire" }

[target.'cfg(target_os = "linux")'.dependencies]
# The agent's PTY, its window size, dirfd-relative setup writes, and a
# nonblocking peek at the events connection. Safe API only.
rustix = { version = "1", features = ["pty", "termios", "fs", "process", "net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
