# Core: secrets — default-on (spec §7.1, §7.2).
#
# Keeps secrets out of the agent's context: secret files (read through the
# agents' file tools, or through shell commands such as `cat`, `grep`,
# `cp`, `curl -d @file`), environment dumps, and secret reads from secret
# managers and cloud CLIs. The agent may still USE those CLIs for normal
# work; only the commands that print a secret or mint a credential are
# blocked.
#
# Files are guarded by path rules: one rule covers the Read tool, `cat`,
# `sudo tail`, `bash -c 'head …'`, a symlink to the file and `../` spellings
# alike, because paths are resolved before they are matched. Writing these
# files stays allowed (an agent may create `.env` from `.env.example`).
#
# Limits (stated, not hidden; the full list is in docs/packs/core.secrets.md):
# a script the agent writes and runs (`python read.py`), a recursive read of a
# whole directory (`grep -r KEY .`) and `git show HEAD:.env` are not seen here.
# Rules that name `~` apply only when the home directory is known and absolute.

[pack]
id = "core.secrets"
name = "Core: secrets"
description = "Guards secret files (.env, SSH keys, cloud credentials), environment dumps and secret reads from secret managers and cloud CLIs."
default_on = true
version = 3
# `gh`, `kubectl`, `aws` … are everyday tools: a command substitution in
# their arguments (`gh pr view $(git branch --show-current)`) must not be
# blocked just because this pack has rules for a few of their subcommands.
substitution_failsafe = false
triggers = ["env", "printenv", "set", "export", "declare", "typeset", "ps", "aws", "gcloud", "az", "kubectl", "vault", "op", "doppler", "gh", "credential", "secret-tool", "security", "org.freedesktop.secrets"]

# --- environment dumps ----------------------------------------------------------
[[deny]]
# Bare `env` (also `sudo env`, `env -0`, `env -u FOO`, `env -i FOO=1`): prints every
# variable. `env FOO=1 cmd` runs a command and is not matched. Matched on the
# whole segment because `env` is a wrapper the engine peels off.
# `--help` / `--version` (or a unique prefix: `--h`, `--vers`) as the FIRST
# argument print no variables, so the first option spells out every long
# option except those (no look-ahead in the regex crate; an `[[allow]]`
# would also shadow other packs' denies, e.g. `env --help >/dev/sda`).
# Later, `--help` may be an option's value (`env --u --help`, `-0u --help`),
# so it counts like any option there. Options taking a value: `-u`/`-C`
# (also at the end of a cluster: `-0u X`), `--unset`/`--chdir` and their
# unique prefixes.
pattern = '^(?:(?:sudo|command|nohup|nice|timeout|time|exec|builtin)(?:\s+(?:-[ugCh]\s+\S+|-\S+|\d+[smhd]?))*\s+)*env(?:\s+(?:-[^-\s]*[uC]\s*\S+|--u(?:n(?:s(?:e(?:t)?)?)?)?(?:=|\s+)\S+|--c(?:h(?:d(?:i(?:r)?)?)?)?(?:=|\s+)\S+|-[^-\s]\S*|--(?:[^hv\s]\S*|h[^e\s]\S*|he[^l\s]\S*|hel[^p\s]\S*|help\S+|v[^e\s]\S*|ve[^r\s]\S*|ver[^s\s]\S*|vers[^i\s]\S*|versi[^o\s]\S*|versio[^n\s]\S*|version\S+)?|\S+=\S*)(?:\s+(?:-[^-\s]*[uC]\s*\S+|--u(?:n(?:s(?:e(?:t)?)?)?)?(?:=|\s+)\S+|--c(?:h(?:d(?:i(?:r)?)?)?)?(?:=|\s+)\S+|-\S+|\S+=\S*))*)?(?:\s*(?:\d*|&)(?:>>?|>&|>\||<<<?|<)\s*\S+)*$'
reason = "a bare `env` prints every environment variable, including tokens and keys"
whole_segment = true

[[deny]]
pattern = '^printenv(?:\s+-\S+)*(?:\s*(?:\d*|&)(?:>>?|>&|>\||<<<?|<)\s*\S+)*$'
reason = "`printenv` without a name prints every environment variable, including tokens and keys"

[[deny]]
pattern = '^set(?:\s*(?:\d*|&)(?:>>?|>&|>\||<<<?|<)\s*\S+)*$'
reason = "a bare `set` prints every shell and environment variable, including tokens and keys"

[[deny]]
pattern = '^export(?:\s+-p)?(?:\s*(?:\d*|&)(?:>>?|>&|>\||<<<?|<)\s*\S+)*$'
reason = "`export -p` prints every exported variable, including tokens and keys"

[[deny]]
pattern = '^(?:declare|typeset)\s+(?:-\S*[xp]\S*)(?:\s*(?:\d*|&)(?:>>?|>&|>\||<<<?|<)\s*\S+)*$'
reason = "`declare -x`/`-p` (and `typeset`) prints every variable, including tokens and keys"

[[deny]]
# BSD-style `ps e`, `ps eww`, `ps auxe` append each process's environment.
# Dashed `ps -e` / `ps -ef` only select processes and are not matched.
pattern = '^ps\s+(?:\S+\s+)*[auxwe]*e[auxwe]*(?:\s|$)'
reason = "`ps e` prints the environment of every process, including tokens and keys"

# --- AWS --------------------------------------------------------------------------
[[deny]]
pattern = '^aws\s+(?:\S+\s+)*secretsmanager\s+(?:\S+\s+)*get-secret-value(?:\s|$)'
reason = "prints a secret from AWS Secrets Manager"

[[deny]]
pattern = '^aws\s+(?:\S+\s+)*ssm\s+(?:\S+\s+)*get-parameters?(?:-by-path)?(?:\s.*)?\s--with-decryption(?:\s|=|$)'
reason = "prints decrypted SecureString parameters from AWS SSM"

[[deny]]
pattern = '^aws\s+(?:\S+\s+)*iam\s+(?:\S+\s+)*create-access-key(?:\s|$)'
reason = "mints a new long-lived AWS access key"

[[deny]]
pattern = '^aws\s+(?:\S+\s+)*sts\s+(?:\S+\s+)*get-session-token(?:\s|$)'
reason = "mints temporary AWS credentials"

# --- Google Cloud -----------------------------------------------------------------
[[deny]]
pattern = '^gcloud\s+(?:\S+\s+)*secrets\s+(?:\S+\s+)*versions\s+(?:\S+\s+)*access(?:\s|$)'
reason = "prints a secret from Google Secret Manager"

[[deny]]
pattern = '^gcloud\s+(?:\S+\s+)*auth\s+(?:\S+\s+)*print-(?:access|identity)-token(?:\s|$)'
reason = "prints a Google Cloud access or identity token"

[[deny]]
pattern = '^gcloud\s+(?:\S+\s+)*iam\s+(?:\S+\s+)*service-accounts\s+(?:\S+\s+)*keys\s+(?:\S+\s+)*create(?:\s|$)'
reason = "mints a new service-account key file"

# --- Azure ------------------------------------------------------------------------
[[deny]]
pattern = '^az\s+(?:\S+\s+)*keyvault\s+(?:\S+\s+)*secret\s+(?:\S+\s+)*(?:show|download)(?:\s|$)'
reason = "prints or downloads a secret from Azure Key Vault"

[[deny]]
pattern = '^az\s+(?:\S+\s+)*account\s+(?:\S+\s+)*get-access-token(?:\s|$)'
reason = "prints an Azure access token"

# --- Kubernetes -------------------------------------------------------------------
[[deny]]
# `kubectl get secret(s)` printing the data: every `-o`/`--output` value
# except `name` and `wide`, and `--template`. `secret` counts only as the
# resource word: the words before it may be flags (with one optional value) or
# `-n`/`--namespace` plus its value, so `-n secret`, `--namespace secret` and
# `get svc secret` are not matched (the long-flag alternative below is
# "any `--flag` except exactly `--namespace`", spelled out because the regex
# crate has no negative look-ahead). Secret before the format ...
pattern = '(?i)^kubectl\s+(?:(?:-n|--namespace)\s+\S+\s+|(?:-(?:[^-n\s]\S*|n\S+)|--(?:[^n\s]\S*|n(?:[^a\s]\S*)?|na(?:[^m\s]\S*)?|nam(?:[^e\s]\S*)?|name(?:[^s\s]\S*)?|names(?:[^p\s]\S*)?|namesp(?:[^a\s]\S*)?|namespa(?:[^c\s]\S*)?|namespac(?:[^e\s]\S*)?|namespace\S+))\s+(?:[^-\s]\S*\s+)?)*get\s+(?:(?:-n|--namespace)\s+\S+\s+|(?:-(?:[^-n\s]\S*|n\S+)|--(?:[^n\s]\S*|n(?:[^a\s]\S*)?|na(?:[^m\s]\S*)?|nam(?:[^e\s]\S*)?|name(?:[^s\s]\S*)?|names(?:[^p\s]\S*)?|namesp(?:[^a\s]\S*)?|namespa(?:[^c\s]\S*)?|namespac(?:[^e\s]\S*)?|namespace\S+))\s+(?:[^-\s]\S*\s+)?)*(?:\S+,)?secrets?(?:\.\w+)*(?:[/,]\S*)?\s+(?:\S+\s+)*(?:(?:-o[=\s]*|--output[=\s]+)(?:yaml|json|jsonpath|go-template|template|custom-columns)|--template)'
reason = "prints Kubernetes secret data"

[[deny]]
# ... or the format before the secret.
pattern = '(?i)^kubectl\s+(?:(?:-n|--namespace)\s+\S+\s+|(?:-(?:[^-n\s]\S*|n\S+)|--(?:[^n\s]\S*|n(?:[^a\s]\S*)?|na(?:[^m\s]\S*)?|nam(?:[^e\s]\S*)?|name(?:[^s\s]\S*)?|names(?:[^p\s]\S*)?|namesp(?:[^a\s]\S*)?|namespa(?:[^c\s]\S*)?|namespac(?:[^e\s]\S*)?|namespace\S+))\s+(?:[^-\s]\S*\s+)?)*get\s+(?:(?:-n|--namespace)\s+\S+\s+|(?:-(?:[^-n\s]\S*|n\S+)|--(?:[^n\s]\S*|n(?:[^a\s]\S*)?|na(?:[^m\s]\S*)?|nam(?:[^e\s]\S*)?|name(?:[^s\s]\S*)?|names(?:[^p\s]\S*)?|namesp(?:[^a\s]\S*)?|namespa(?:[^c\s]\S*)?|namespac(?:[^e\s]\S*)?|namespace\S+))\s+(?:[^-\s]\S*\s+)?)*(?:(?:-o[=\s]*|--output[=\s]+)(?:yaml|json|jsonpath|go-template|template|custom-columns)|--template)\S*\s+(?:(?:-n|--namespace)\s+\S+\s+|(?:-(?:[^-n\s]\S*|n\S+)|--(?:[^n\s]\S*|n(?:[^a\s]\S*)?|na(?:[^m\s]\S*)?|nam(?:[^e\s]\S*)?|name(?:[^s\s]\S*)?|names(?:[^p\s]\S*)?|namesp(?:[^a\s]\S*)?|namespa(?:[^c\s]\S*)?|namespac(?:[^e\s]\S*)?|namespace\S+))\s+(?:[^-\s]\S*\s+)?)*(?:\S+,)?secrets?(?:\.\w+)*(?:[/,]\S*)?(?:\s|$)'
reason = "prints Kubernetes secret data"

[[deny]]
# The raw API path reads secrets without any resource word or output format.
# Any raw path naming `secrets` (a query string such as `?limit=1` included)
# or holding a `%` escape (`%73ecrets`) is denied.
pattern = '(?i)^kubectl\s+(?:\S+\s+)*get\s+(?:\S+\s+)*--raw[=\s]+\S*(?:secrets|%)'
reason = "reads Kubernetes secrets through the raw API"

[[deny]]
# The kubeconfig holds credentials; `--raw`/`--flatten` stop the redaction.
pattern = '^kubectl\s+(?:\S+\s+)*config\s+(?:\S+\s+)*view\s+(?:\S+\s+)*--(?:raw|flatten)(?:\s|=|$)'
reason = "prints the unredacted kubeconfig, including credentials"

[[deny]]
# Flags may come before the key: a valueless global flag (`--debug`,
# `--no-…`), `--flag=value`, or `--flag value` (that value is not the key).
pattern = '(?i)^aws\s+(?:\S+\s+)*configure\s+(?:\S+\s+)*get\s+(?:--(?:debug|no-[a-z-]+|cli-auto-prompt)\s+|--[a-z-]+=\S+\s+|--[a-z-]+\s+[^-\s]\S*\s+)*[^-\s]\S*(?:secret|token|password|key)'
reason = "prints an AWS secret from the local AWS configuration"

[[deny]]
pattern = '^aws\s+(?:\S+\s+)*configure\s+(?:\S+\s+)*export-credentials(?:\s|$)'
reason = "prints the resolved AWS credentials"

[[deny]]
pattern = '^aws\s+(?:\S+\s+)*sts\s+(?:\S+\s+)*(?:assume-role\S*|get-federation-token)(?:\s|$)'
reason = "mints temporary AWS credentials"

[[deny]]
pattern = '^gcloud\s+(?:\S+\s+)*config\s+(?:\S+\s+)*config-helper(?:\s|$)'
reason = "prints a Google Cloud access token"

[[deny]]
pattern = '^git\s+(?:\S+\s+)*credential\s+(?:\S+\s+)*(?:fill|get)(?:\s|$)'
reason = "prints the password or token stored in the git credential helper"

[[deny]]
# `git credential-store get`, `git-credential-osxkeychain get` …
pattern = '^(?:git\s+(?:\S+\s+)*|(?:\S*/)?git-)credential-\S+\s+(?:\S+\s+)*get(?:\s|$)'
reason = "prints the password or token stored in a git credential helper"

# --- secret managers and tokens ---------------------------------------------------
[[deny]]
pattern = '^vault\s+(?:\S+\s+)*(?:read|kv\s+(?:\S+\s+)*get)(?:\s|$)'
reason = "prints a secret from HashiCorp Vault"

[[deny]]
pattern = '^op\s+(?:\S+\s+)*(?:read|item\s+(?:\S+\s+)*get)(?:\s|$)'
reason = "prints a secret from 1Password"

[[deny]]
pattern = '^doppler\s+(?:\S+\s+)*secrets(?:\s|$)'
reason = "prints secrets from Doppler"

[[deny]]
pattern = '^gh\s+(?:\S+\s+)*auth\s+(?:\S+\s+)*token(?:\s|$)'
reason = "prints the GitHub CLI token"

[[deny]]
pattern = '^gh\s+(?:\S+\s+)*auth\s+status\s+(?:\S+\s+)*(?:--show-token|-t)(?:\s|$)'
reason = "prints the GitHub CLI token"

# --- the personal broker's vault key (plan 16) ----------------------------------
[[deny]]
pattern = '(?i)^secret-tool\s+(?:\S+\s+)*(?:lookup|search)\s+(?:\S+\s+)*(?:\S*saiife\S*|vault-key)(?:\s|$)'
reason = "reads saiife's vault key from the keychain"

[[deny]]
pattern = '(?i)^security\s+(?:\S+\s+)*(?:find|dump)-generic-password\s+(?:\S+\s+)*(?:\S*saiife\S*|vault-key)(?:\s|$)'
reason = "reads saiife's vault key from the keychain"

[[deny]]
# A search with options only (`--all`, `--unlock`) lists every item.
pattern = '(?i)^secret-tool\s+search(?:\s+-\S+)*\s*$'
reason = "reads saiife's vault key from the keychain"

[[deny]]
# Options only (`-w`, `-ga`): no service, account or label narrows it.
pattern = '(?i)^security\s+(?:\S+\s+)*find-generic-password(?:\s+-\S+)*\s*$'
reason = "reads saiife's vault key from the keychain"

[[deny]]
pattern = '(?i)^security\s+(?:\S+\s+)*dump-keychain(?:\s|$)'
reason = "reads saiife's vault key from the keychain"

[[deny]]
pattern = '(?i)^(?:gdbus|busctl|dbus-send|qdbus)\s.*org\.freedesktop\.secrets.*(?:GetSecrets?|SearchItems)'
reason = "reads saiife's vault key from the keychain"

# --- secret files (read tools and shell readers) ----------------------------------
[[deny_path]]
glob = "**/.env"
access = "read"
reason = "`.env` files hold secrets"

[[deny_path]]
glob = "**/.envrc"
access = "read"
reason = "`.envrc` (direnv) files export secrets"

[[deny_path]]
glob = "**/.env.*"
access = "read"
reason = "`.env.*` files hold secrets"

[[allow_path]]
glob = "**/.env.example"
access = "read"
reason = "example env files hold no secrets"

[[allow_path]]
glob = "**/.env.sample"
access = "read"
reason = "sample env files hold no secrets"

[[allow_path]]
glob = "**/.env.dist"
access = "read"
reason = "dist env files hold no secrets"

[[allow_path]]
glob = "**/.env.defaults"
access = "read"
reason = "default env files hold no secrets"

[[allow_path]]
glob = "**/.env.template"
access = "read"
reason = "template env files hold no secrets"

[[deny_path]]
glob = "**/.ssh/id_*"
access = "read"
reason = "SSH private keys"

[[allow_path]]
glob = "**/.ssh/id_*.pub"
access = "read"
reason = "public keys are not secret"

[[deny_path]]
glob = "**/.aws/credentials"
access = "read"
reason = "AWS credentials"

[[deny_path]]
glob = "**/.config/gcloud/**"
access = "read"
reason = "Google Cloud credentials"

[[deny_path]]
glob = "**/.azure/**"
access = "read"
reason = "Azure credentials"

[[deny_path]]
glob = "**/.kube/config"
access = "read"
reason = "Kubernetes credentials"

[[deny_path]]
glob = "**/.npmrc"
access = "read"
reason = "`.npmrc` can hold registry tokens"

[[deny_path]]
glob = "**/.pypirc"
access = "read"
reason = "`.pypirc` holds package index passwords"

[[deny_path]]
glob = "**/.netrc"
access = "read"
reason = "`.netrc` holds login passwords"

[[deny_path]]
glob = "**/.docker/config.json"
access = "read"
reason = "Docker registry credentials"

[[deny_path]]
glob = "**/.config/gh/hosts.yml"
access = "read"
reason = "the GitHub CLI token file"

[[deny_path]]
glob = "**/.vault-token"
access = "read"
reason = "the HashiCorp Vault token"

[[deny_path]]
glob = "**/.git-credentials"
access = "read"
reason = "stored git passwords and tokens"

[[deny_path]]
glob = "**/.aws/sso/cache/**"
access = "read"
reason = "cached AWS SSO tokens"

[[deny_path]]
glob = "**/.aws/cli/cache/**"
access = "read"
reason = "cached AWS temporary credentials"

[[deny_path]]
glob = "/proc/*/task/*/environ"
access = "read"
reason = "a thread's process environment holds tokens and keys"

[[deny_path]]
# Linux: another way to dump a process's environment.
glob = "/proc/*/environ"
access = "read"
reason = "a process's environment holds tokens and keys"

# --- the agents' own login tokens -------------------------------------------------
# An agent that reads its own token can act as the user elsewhere. Settings
# files stay readable. `$CLAUDE_CONFIG_DIR` and `$CODEX_HOME` are the variable's
# value when set and absolute; otherwise (unset, empty or relative) they are
# `~/.claude` / `~/.codex`, which needs a known, absolute home directory.

[[deny_path]]
glob = "~/.claude/.credentials.json"
access = "read"
reason = "the agent's own login token; reading it lets the agent act as you elsewhere"

[[deny_path]]
glob = "$CLAUDE_CONFIG_DIR/.credentials.json"
access = "read"
reason = "the agent's own login token; reading it lets the agent act as you elsewhere"

[[deny_path]]
glob = "~/.codex/auth.json"
access = "read"
reason = "the agent's own login token; reading it lets the agent act as you elsewhere"

[[deny_path]]
glob = "$CODEX_HOME/auth.json"
access = "read"
reason = "the agent's own login token; reading it lets the agent act as you elsewhere"

[[deny_path]]
glob = "~/.gemini/oauth_creds.json"
access = "read"
reason = "the agent's own login token; reading it lets the agent act as you elsewhere"
