# Core: filesystem — catastrophic-only, default-on.
#
# Precision over coverage: this pack blocks the irrecoverable footguns
# (wiping a filesystem root / home / system dir, writing over a raw device,
# formatting a disk) and deliberately stays quiet on ordinary relative or
# temp-path deletes. Everything it does not match fails open (allowed).

[pack]
id = "core.filesystem"
name = "Core: filesystem"
description = "Guards catastrophic filesystem destruction (root/home/system wipes, device writes, mkfs)."
default_on = true
version = 2
# `sudo` (with or without flags/options) is unwrapped structurally by the
# engine before matching (see `wrappers::unwrap_transparent_prefix`), so
# these rules see the effective command at argv[0], not `sudo` itself. The
# `(?:sudo\s+)?` prefix below predates that and is now redundant/harmless —
# kept rather than churned. Triggers stay broad + cheap.
# A `(?i)` trigger ignores case (Windows commands do): the Windows rules below.
triggers = ["rm", "dd", "mkfs", "truncate", "chmod", "chown", "/dev/", "(?i)format", "(?i)diskpart", "(?i)clear-disk", "(?i)remove-partition", "(?i)initialize-disk", "(?i)reset-physicaldisk", "(?i)remove-virtualdisk", "(?i)cipher", "(?i)vssadmin", "(?i)wbadmin", "(?i)wmic"]

# --- rm: recursive delete of a catastrophic target ----------------------------
# Requires a recursive flag (combined like -rf/-fr/-Rf, or -r/-R, or
# --recursive) AND a catastrophic target (filesystem root, a top-level system
# directory, or the user's home). Ordinary `rm -rf ./build` or `rm -rf /tmp/x`
# do NOT match — the target must be a root/home/system path. Quoting
# (`rm -rf "/"`) and repeated slashes (`rm -rf //`) are undone by
# normalization before these patterns ever run, so they don't need to spell
# those out. Two orderings are needed because the flag and the target can
# appear in either order on the command line (`rm -rf /etc` vs `rm /etc -rf`).
# The home targets include its dotfiles (`~/.*`): `cd ~ && rm -rf .*` is
# judged as `rm -rf ~/.*` (the engine joins a destructive command's relative
# operands onto the directory a `cd` earlier on the line moved to).
[[deny]]
pattern = '^(?:sudo\s+)?rm\s+(?:\S+\s+)*(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)\s+(?:\S+\s+)*(?:/\*|(?:~|\$HOME|\$\{HOME\})(?:/\.\*|/?\*?)|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|dev|sys|proc|opt|root|home|srv|mnt|System|Library|Applications|Users|Volumes)/?\*?|/)(?:\s|$)'
reason = "recursive rm on a filesystem root, home, or system directory is catastrophic and irreversible"

[[deny]]
# Same target class, flag AFTER the target (`rm /etc -rf`, `rm / --recursive`).
pattern = '^(?:sudo\s+)?rm\s+(?:\S+\s+)*(?:/\*|(?:~|\$HOME|\$\{HOME\})(?:/\.\*|/?\*?)|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|dev|sys|proc|opt|root|home|srv|mnt|System|Library|Applications|Users|Volumes)/?\*?|/)\s+(?:\S+\s+)*(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
reason = "recursive rm on a filesystem root, home, or system directory is catastrophic and irreversible"

[[deny]]
pattern = '^(?:sudo\s+)?rm\s+.*--no-preserve-root\b'
reason = "rm --no-preserve-root exists only to defeat the root-deletion guard"

# --- raw device / disk destruction -------------------------------------------
[[deny]]
pattern = '^(?:sudo\s+)?dd\s+.*\bof=/dev/[a-zA-Z]'
reason = "dd writing to a block device (of=/dev/...) overwrites the raw disk"

[[deny]]
pattern = '^(?:sudo\s+)?mkfs(?:\.[a-zA-Z0-9]+)?\b'
reason = "mkfs formats a filesystem, erasing everything on the target device"

[[deny]]
pattern = '^(?:sudo\s+)?truncate\s+.*/dev/[a-zA-Z]'
reason = "truncate on a device node corrupts the raw disk"

[[deny]]
pattern = '>\s*/dev/(?:sd|hd|vd|disk|rdisk|nvme|mmcblk)'
reason = "redirecting output onto a raw block device overwrites the disk"

# --- recursive permission changes on a system root ---------------------------
# Targets: the root (`/`, `/*`) or a top-level system directory.
[[deny]]
pattern = '^(?:sudo\s+)?chmod\s+(?:\S+\s+)*-[a-zA-Z]*R[a-zA-Z]*\s+(?:\S+\s+)*(?:/\*|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|dev|sys|proc|opt|root|home|srv|mnt|System|Library|Applications|Users)/?\*?|/)(?:\s|$)'
reason = "recursive chmod on a filesystem root or system directory breaks the system"

[[deny]]
pattern = '^(?:sudo\s+)?chown\s+(?:\S+\s+)*-[a-zA-Z]*R[a-zA-Z]*\s+(?:\S+\s+)*\S+\s+(?:/\*|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|dev|sys|proc|opt|root|home|srv|mnt|System|Library|Applications|Users)/?\*?|/)(?:\s|$)'
reason = "recursive chown on a filesystem root or system directory breaks ownership system-wide"

# --- Windows (plan 19a, W7) -----------------------------------------------------
# These patterns apply on every OS, where they match nothing real: a drive
# letter followed by a colon is not a Linux or macOS path. They are case-
# insensitive, accept any drive letter and read `\` and `/` alike. PowerShell
# and cmd forms arrive translated (`Remove-Item -Recurse -Force C:\`, `rd /s
# /q C:\` are `rm -r -f C:\`), so `rm` is what is named here. The lines are
# matched as written: a drive, `\\?\C:\`, an admin share (`\\localhost\c$\`),
# a Git Bash mount (`/c/`, `/cygdrive/c/`) or an unexpanded system variable
# (`%SystemRoot%`, `$env:windir`) can stand for the root.
#
# Not matched, by design: a user's own profile spelled as a path
# (`C:\Users\a`), because a profile name may hold a space and the line cannot
# tell `C:\Users\John Smith\proj` from `C:\Users\John` (`~`, `$HOME`,
# `$env:USERPROFILE` and `%USERPROFILE%` are judged by the rule above).
[[deny]]
id = "windows-root-rm"
pattern = '(?i)^rm\s+(?:\S+\s+)*(?:(?:-[a-z]*r[a-z]*|--recursive)\s+(?:\S+\s+)*(?:\\+(?:\*(?:\.\*)?)?|(?:(?:[\\/]{2}[?.][\\/])?[a-z]:|[\\/]{2}(?:localhost|127\.0\.0\.1)[\\/][a-z]\$)[\\/]*(?:\*(?:\.\*)?)?|(?:(?:[\\/]{2}[?.][\\/])?[a-z]:|[\\/]{2}(?:localhost|127\.0\.0\.1)[\\/][a-z]\$)[\\/]+(?:windows|program files(?: \(x86\))?|programdata|users)[\\/]*(?:\*(?:\.\*)?)?|(?:%(?:systemroot|windir|systemdrive|homedrive|programdata|allusersprofile|programfiles|programfiles\(x86\)|programw6432|public)%|\$\{?env:(?:systemroot|windir|systemdrive|homedrive|programdata|allusersprofile|programfiles|programw6432|public)\}?)[\\/]*(?:\*(?:\.\*)?)?|/cygdrive/[a-z]/?(?:\*(?:\.\*)?)?|/[a-z]/\*|/[a-z]/(?:windows|program files(?: \(x86\))?|programdata|users)/?(?:\*(?:\.\*)?)?)|(?:\\+(?:\*(?:\.\*)?)?|(?:(?:[\\/]{2}[?.][\\/])?[a-z]:|[\\/]{2}(?:localhost|127\.0\.0\.1)[\\/][a-z]\$)[\\/]*(?:\*(?:\.\*)?)?|(?:(?:[\\/]{2}[?.][\\/])?[a-z]:|[\\/]{2}(?:localhost|127\.0\.0\.1)[\\/][a-z]\$)[\\/]+(?:windows|program files(?: \(x86\))?|programdata|users)[\\/]*(?:\*(?:\.\*)?)?|(?:%(?:systemroot|windir|systemdrive|homedrive|programdata|allusersprofile|programfiles|programfiles\(x86\)|programw6432|public)%|\$\{?env:(?:systemroot|windir|systemdrive|homedrive|programdata|allusersprofile|programfiles|programw6432|public)\}?)[\\/]*(?:\*(?:\.\*)?)?|/cygdrive/[a-z]/?(?:\*(?:\.\*)?)?|/[a-z]/\*|/[a-z]/(?:windows|program files(?: \(x86\))?|programdata|users)/?(?:\*(?:\.\*)?)?)\s+(?:\S+\s+)*(?:-[a-z]*r[a-z]*|--recursive))(?:\s|$)'
reason = "recursive delete of a drive root, Windows, Program Files, ProgramData or Users is catastrophic and irreversible"

[[deny]]
# `format C: /q`, `format.com D: /fs:ntfs`, the storage cmdlets (even fed from
# a pipe: `Get-Volume D | Format-Volume`) and `diskpart`, which runs commands
# the guard cannot see. `Format-Table` and `Format-List` do not match.
id = "windows-format"
pattern = '(?i)^(?:\S*[\\/])?(?:format(?:\.com|\.exe)?\s+(?:\S+\s+)*(?:(?:[\\/]{2}[?.][\\/])?[a-z]:|\\\\\?\\volume\{\S+)[\\/]*(?:\s|$)|diskpart(?:\.exe)?(?:\s|$)|(?:format-volume|clear-disk|remove-partition|initialize-disk|reset-physicaldisk|remove-virtualdisk)(?:\s|$))'
reason = "formatting, partitioning or wiping a disk destroys its data"

[[deny]]
# `cipher /w:C:\` overwrites all free space; `cipher /e` and `/d` stay allowed.
id = "windows-cipher-wipe"
pattern = '(?i)^(?:\S*[\\/])?cipher(?:\.exe)?\s+(?:\S+\s+)*/w(?::|\s|$)'
reason = "cipher /w overwrites all the free space on a volume, which erases deleted files for good"

[[deny]]
# Shadow copies and backups are the way back from a bad delete.
id = "windows-shadow-copies"
pattern = '(?i)^(?:\S*[\\/])?(?:vssadmin(?:\.exe)?\s+(?:delete\s+shadows|resize\s+shadowstorage)|wbadmin(?:\.exe)?\s+delete\s|wmic(?:\.exe)?\s+(?:\S+\s+)*shadowcopy\s+(?:\S+\s+)*delete)'
reason = "deleting shadow copies or backups removes the way back from a bad delete"
