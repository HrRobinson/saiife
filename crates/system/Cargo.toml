[package]
name = "saiife-system"
description = "Locked mode on Linux for saiife: file layout, privileged host actions, supported-system check and the systemd unit."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_system"
path = "src/lib.rs"

[dependencies]
saiife-agents = { path = "../agents" }
saiife-policy = { path = "../policy" }
saiife-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22.27"
sha2 = "0.10.9"
time = { version = "0.3", features = ["formatting", "macros"] }
getrandom = "0.3"
zeroize = "1.8"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "system"] }

[dev-dependencies]
tempfile = "3"
