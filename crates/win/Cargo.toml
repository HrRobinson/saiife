[package]
name = "saiife-win"
description = "Windows pieces of saiife: service SIDs, the uid mapping and SDDL parsing. All pure until plan 19b adds FFI."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_win"
path = "src/lib.rs"

[features]
# The named-pipe server (plan 19b). Empty until then.
pipe-server = []

[dependencies]
dirs = "5"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [] }

# The workspace forbid, like every other crate: there is no FFI in plan 19a.
# Plan 19b drops this when it adds FFI, along with the crate root's forbid and
# the matching rules in scripts/check-unsafe.sh.
[lints]
workspace = true
