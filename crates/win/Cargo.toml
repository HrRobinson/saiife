[package]
name = "saiife-win"
description = "Windows pieces of saiife: service SIDs, the uid mapping, SDDL parsing and the one FFI boundary on Windows."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_win"
path = "src/lib.rs"

[features]
# The named-pipe server (plan 19b). The hook path never turns this on, so it stays free of tokio.
pipe-server = ["dep:tokio"]

[dependencies]
dirs = "5"
sha1 = "0.10"
sha2 = "0.10"
# zeroize 1.9.1 is from 2026-10-06 (already in Cargo.lock): a credential read is wiped on drop.
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
# The one service entry (W1): `define_windows_service!` expands to unsafe, so it is here.
windows-service = "=0.8.1"
tokio = { version = "1", features = ["net"], optional = true }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros"] }
tempfile = "3"

# Not the workspace lints: the second crate allowed unsafe (W1), after
# saiife-darwin. Denied here, allowed only in src/ffi/ (one attribute, in
# src/ffi/mod.rs), and forbidden off Windows by the crate root.
[lints.rust]
unsafe_code = "deny"
