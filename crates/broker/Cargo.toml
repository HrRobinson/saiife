[package]
name = "saiife-broker"
description = "Connector manifests, parameter validation and operation resolution for the saiife gateway."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_broker"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
thiserror = "1"
percent-encoding = "2"
saiife-policy = { path = "../policy" }

[dev-dependencies]
tempfile = "3"
