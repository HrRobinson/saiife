name = "gemini"
description = "Google Gemini CLI in its TUI (beta)"

[agent]
kind = "gemini"
command = ["gemini"]
login = "api-key"
credential = "gemini"

[image]
base = "default"

[size]
vcpus = 2
mem_mib = 4096
mem_max_mib = 8192
disk_gib = 30

[egress]
allow = []

[secrets]
names = []

[rules]
profile = "default"

[touch]
classes = ["land", "push_protected"]

[idle]
stop_after_mins = 120
