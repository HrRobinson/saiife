name = "codex"
description = "OpenAI Codex CLI in its TUI (beta)"

[agent]
kind = "codex"
# Hooks are managed via /etc/codex/requirements.toml in the image (plan 42 R7),
# so there is no hook-trust bypass.
command = ["codex"]
login = "api-key"
credential = "openai"

[image]
base = "default"

[size]
vcpus = 2
mem_mib = 4096
mem_max_mib = 8192
disk_gib = 30

[egress]
allow = []

[secrets]
names = []

[rules]
profile = "default"

[touch]
classes = ["land", "push_protected"]

[idle]
stop_after_mins = 120
