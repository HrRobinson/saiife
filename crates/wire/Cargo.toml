[package]
name = "saiife-wire"
description = "saiife Workspace wire: signed frames, access levels, pairing, sealing and the box source seam."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_wire"
path = "src/lib.rs"

[features]
fake = ["saiife-touch/soft"]

[dependencies]
# No new crates (2026-11-11): every version below is already in Cargo.lock.
# ring 0.17.14: already in Cargo.lock through rustls; base64 0.23.1 from
# 2026-08-04 (crates/broker); sha2 0.10 as in the other crates.
ring = "=0.17.14"
sha2 = "0.10"
base64 = "=0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saiife-touch = { path = "../touch" }

[dev-dependencies]
saiife-ipc = { path = "../ipc" }

[lints]
workspace = true
