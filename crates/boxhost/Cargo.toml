[package]
name = "saiife-boxhost"
description = "saiife box host side: the Cloud Hypervisor Vmm driver, disks, images, vsock and terminal."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_boxhost"
path = "src/lib.rs"

[dependencies]
saiife-boxproto = { path = "../boxproto" }
# The Vmm trait ChVmm implements (boxes never depends on boxhost).
saiife-boxes = { path = "../boxes" }
# The hook matcher and timeout (tokio-free) and the user pack id rule.
saiife-agents = { path = "../agents" }
saiife-policy = { path = "../policy" }
# BoxId (tokio-free).
saiife-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
# O_NOFOLLOW / O_NONBLOCK constants only; no unsafe.
rustix = { version = "1", features = ["fs", "process", "net", "event"] }
ring = "=0.17.14"
serde_json = "1"
toml = "0.8"
# Headless terminal for the box PTY (spec §9.4); pinned.
vt100 = "=0.15.2"

[features]
# Builds the saiife-fake-ch test binary.
fake = []

[[bin]]
name = "saiife-fake-ch"
path = "src/bin/fake_ch.rs"
required-features = ["fake"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
