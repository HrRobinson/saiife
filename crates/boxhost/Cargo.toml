[package]
name = "saiife-boxhost"
description = "saiife box host side: the Cloud Hypervisor Vmm driver, disks, images, vsock and terminal."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_boxhost"
path = "src/lib.rs"

[dependencies]
saiife-boxproto = { path = "../boxproto" }
# The Vmm trait ChVmm implements (boxes never depends on boxhost).
saiife-boxes = { path = "../boxes" }
# BoxId (tokio-free).
saiife-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
# O_NOFOLLOW / O_NONBLOCK constants, *at calls and a non-blocking API
# socket connect; no unsafe. (`net` is already enabled by saiife-ipc.)
rustix = { version = "1", features = ["fs", "process", "net"] }
ring = "=0.17.14"
serde_json = "1"
toml = "0.8"

[features]
# Builds the saiife-fake-ch test binary.
fake = []

[[bin]]
name = "saiife-fake-ch"
path = "src/bin/fake_ch.rs"
required-features = ["fake"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
