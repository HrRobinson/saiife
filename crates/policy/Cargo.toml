[package]
name = "saiife-policy"
description = "Locked-mode policy for saiife: /etc config, policy.d drop-ins, scopes, project merge and the policy hash."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_policy"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
thiserror = "1"
# Random temp-file names for installed.toml.
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Only the O_NONBLOCK / O_NOFOLLOW constants; no unsafe calls.
libc = "0.2"
