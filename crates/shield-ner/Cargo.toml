[package]
name = "saiife-shield-ner"
description = "Data Shield local name detector: WordPiece, BIO decoding and the saiife-ner runtime (tokio-free)."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_shield_ner"
path = "src/lib.rs"

[dependencies]
saiife-shield = { path = "../shield" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
unicode-normalization = "=0.1.25"
tract-onnx = "=0.23.9"

[dev-dependencies]
# The exact prost tract-onnx 0.23.9 resolves to (it does not re-export it):
# the tests encode a synthetic ModelProto.
prost = "=0.14.4"

[lints]
workspace = true
