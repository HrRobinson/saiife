[package]
name = "saiife-mcp"
description = "JSON-RPC 2.0 and the MCP subset saiife speaks: bounded line codec, message and tool types, version negotiation."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_mcp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
