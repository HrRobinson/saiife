[package]
name = "saiife-boxproto"
description = "saiife box guest protocol: frames, messages, ports, deltas and manifests shared by host and guest."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_boxproto"
path = "src/lib.rs"

[dependencies]
# The base manifest (plan 37): JSON, and its SHA-256 (pure Rust, so the guest
# builds everywhere).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The shared sanitizer predicate (plan 39 R-P8): delta paths and symlink
# targets with control, bidi or invisible chars are refused.
saiife-wire = { path = "../wire" }
# R-T3l: path components must be NFC, and the one comparison key folds
# canonical decompositions.
unicode-normalization = "=0.1.25"

[lints]
workspace = true
