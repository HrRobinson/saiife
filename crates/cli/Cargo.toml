[package]
name = "saiife"
description = "Guard and audit for AI coding agents."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "saiife"
path = "src/main.rs"

[dependencies]
saiife-guard = { path = "../guard" }
saiife-audit = { path = "../audit" }
saiife-agents = { path = "../agents" }
saiife-daemon = { path = "../daemon" }
saiife-policy = { path = "../policy" }
saiife-ipc = { path = "../ipc" }
saiife-system = { path = "../system" }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# The developer hook reads /etc/saiife/config.toml as a raw table.
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
dirs = "5"

[target.'cfg(unix)'.dependencies]
# Signals for the worker fault seam (debug builds); no unsafe calls.
rustix = { version = "1", features = ["process", "termios"] }
# Secret values `saiife secret` reads are wiped when dropped.
zeroize = "=1.9.1"
# Only the O_NONBLOCK / O_NOFOLLOW constants; no unsafe calls.
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
