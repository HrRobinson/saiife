[package]
name = "saiife"
description = "Guard and audit for AI coding agents."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "saiife"
path = "src/main.rs"

[dependencies]
saiife-guard = { path = "../guard" }
saiife-audit = { path = "../audit" }
saiife-agents = { path = "../agents" }
saiife-daemon = { path = "../daemon" }
saiife-policy = { path = "../policy" }
saiife-ipc = { path = "../ipc" }
saiife-system = { path = "../system" }
saiife-broker = { path = "../broker" }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# The developer hook reads /etc/saiife/config.toml as a raw table.
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
dirs = "5"
# `saiife api` sends and reads bodies as base64 (the version saiife-broker uses).
base64 = "=0.23.1"

[target.'cfg(unix)'.dependencies]
# Signals for the worker fault seam (debug builds); no unsafe calls.
rustix = { version = "1", features = ["process", "termios", "fs"] }
base64 = "=0.23.1"
# Secret values `saiife secret` reads are wiped when dropped.
zeroize = "=1.9.1"
# Only the O_NONBLOCK / O_NOFOLLOW constants; no unsafe calls.
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Loopback HTTPS mock for `saiife api` (versions as in saiife-broker; ring only).
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
