[package]
name = "saiife"
description = "Guard and audit for AI coding agents."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "saiife"
path = "src/main.rs"

[dependencies]
saiife-guard = { path = "../guard" }
saiife-audit = { path = "../audit" }
saiife-agents = { path = "../agents" }
saiife-daemon = { path = "../daemon" }
saiife-policy = { path = "../policy" }
saiife-ipc = { path = "../ipc" }
saiife-system = { path = "../system" }
saiife-broker = { path = "../broker" }
# JSON-RPC and the MCP subset (`__fake-mcp-server`, and later `saiife mcp`).
saiife-mcp = { path = "../mcp" }
# `saiife daemon --user` opens the keychain that holds the vault key.
saiife-keychain = { path = "../keychain" }
# `saiife dev`: compose stacks behind one local HTTPS proxy (plans 22 to 24).
saiife-dev = { path = "../dev" }
# `saiife mcp`: the JSON-RPC/MCP codec and types (tokio-free).
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The hash of the exact command a grant is for (`raw_sha256`); also the
# body hash the approvals tests check.
sha2 = "0.10"
# The developer hook reads /etc/saiife/config.toml as a raw table.
toml = "0.8"
toml_edit = "0.22.27"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
saiife-win = { path = "../win" }
# `saiife api` sends and reads bodies as base64 (the version saiife-broker uses).
base64 = "=0.23.1"
# `saiife workspace serve` runs the Workspace link (plan 29).
saiife-link = { path = "../link" }
# 0.14.1 is from 2024-07-05; no default features: no image crate.
qrcode = { version = "=0.14.1", default-features = false }
# Secret values `saiife secret` reads are wiped when dropped.
zeroize = "=1.9.1"
# `saiife touch` and touch approvals: the soft key is compiled in; only debug
# builds pick it (the `SAIIFE_TEST_TOUCH_SOFT` seam).
saiife-touch = { path = "../touch", features = ["soft"] }
# CTAP2 over USB HID for FIDO2 keys (`fido-hid`, off by default: the static
# musl Linux builds have no libudev).
ctap-hid-fido2 = { version = "=3.6.0", optional = true }

[features]
fido-hid = ["dep:ctap-hid-fido2"]
# A fake VM behind the daemon's box manager (plan 34): test builds only. The
# release workflows never enable it. The daemon runs inside this binary
# (`saiife daemon`), so the feature reaches the daemon the tests start.
fake-vmm = ["saiife-daemon/fake-vmm"]

[target.'cfg(unix)'.dependencies]
saiife-boxhost = { path = "../boxhost" }
# The base manifest of a box's repo disk (plan 37), and the BoxId its base ref names.
saiife-boxproto = { path = "../boxproto" }
saiife-wire = { path = "../wire" }
# The random name of a spawn's staging dir; the version saiife-boxhost uses.
ring = "=0.17.14"
# Signals for the worker fault seam (debug builds); no unsafe calls.
rustix = { version = "1", features = ["process", "termios", "fs"] }
base64 = "=0.23.1"
# A runtime for `saiife workspace serve`, and the SIGINT wait of `workspace pair`
# (the version saiife-link uses).
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time", "signal"] }
# Only the O_NONBLOCK / O_NOFOLLOW constants; no unsafe calls.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same-user approvals: an empty authorization reference whose external form
# the daemon's `security authorize` uses (plan 13, decision 3). Safe API
# only; the version saiife-keychain uses.
security-framework = "=3.7.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Loopback HTTPS mock for `saiife api` (versions as in saiife-broker; ring only).
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
# The approvals tests serve an in-process daemon context to the CLI (an
# approver with a second uid at the ops level); the version saiife-daemon uses.
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
# The workspace tests pair a `TestDevice` through link.sock.
saiife-wire = { path = "../wire", features = ["fake"] }

[target.'cfg(windows)'.dependencies]
# A console prompt without echo, for `secret add` and `connect` (never for approvals: W16).
rpassword = "=7.4.0"

[target.'cfg(windows)'.dev-dependencies]
# A squatter on the control pipe, in `windows_locked`; the version saiife-daemon uses.
saiife-win = { path = "../win", features = ["pipe-server"] }
tokio = { version = "=1.53.2", features = ["rt", "net"] }

[lints]
workspace = true
