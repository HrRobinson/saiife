[package]
name = "saiife-ipc"
description = "Control-socket protocol for saiife locked mode: frames, messages, blocking client, peer credentials."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_ipc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hook key: SHA-256 of the canonical `tool_input` (plan 20).
sha2 = "0.10"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "fs", "process", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
# LOCAL_PEERCRED / LOCAL_PEERPID and getpwnam_r through nix's safe API.
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user"] }
saiife-darwin = { path = "../darwin" }

[target.'cfg(windows)'.dependencies]
# The pipe's calls and token facts. Without `pipe-server`: the hook path stays free of tokio.
saiife-win = { path = "../win" }

[dev-dependencies]
tempfile = "3"
# The pure rules behind the pipe, tested on every OS.
saiife-win = { path = "../win" }

[target.'cfg(windows)'.dev-dependencies]
saiife-win = { path = "../win", features = ["pipe-server"] }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
