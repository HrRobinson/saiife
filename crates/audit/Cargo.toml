[package]
name = "saiife-audit"
description = "Audit log for saiife: one masked JSONL record per guard decision."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "saiife_audit"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
dirs = "5"
sha2 = "0.10"
getrandom = "0.3"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.22"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Only the O_NONBLOCK / O_NOFOLLOW constants; no unsafe calls.
libc = "0.2"
# Safe getuid for the record's `uid`.
rustix = { version = "1", features = ["process", "fs"] }

[lints]
workspace = true
